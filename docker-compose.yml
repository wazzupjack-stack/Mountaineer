services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 8080
      SESSION_COOKIE_SECURE: "false"
      AMBIENT_BOTS_ENABLED: "true"
      # DEMO ONLY — inflates the *displayed* jackpot numbers with fake
      # activity for demos/testing. Never touches real money, never
      # persisted to the database (see Room.displayJackpot() in
      # backend/src/game/room.js) — flip to "false" or just delete this
      # line whenever the demo is over, nothing needs cleaning up after.
      DEMO_JACKPOT_BOOST_ENABLED: "true"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
