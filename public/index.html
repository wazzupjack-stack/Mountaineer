/* ═══ RENDER ═══ */
const PPM=()=>H/210;
const CY =()=>H*0.62;
const CXS=()=>W*0.40;

/* #mult-box's own current rect, in canvas-space (0,0 = #stage's own
   top-left, matching every x/y the ruler below already draws in) — so the
   altitude ruler's "X,XXX m" labels can skip the handful that would land
   directly behind it instead of visibly crossing through it. Read fresh
   off the DOM each call rather than cached at resize() time: #mult-box's
   own height changes with its content (e.g. the extra "SUMMIT PUSH"/sub
   line) independently of any resize, and this is one cheap rect read for
   a single already-laid-out element, not the kind of read/write pair that
   actually triggers layout thrashing. Works identically for desktop's
   centered box and mobile's top-anchored one — wherever CSS actually put
   it is what gets kept clear, with no separate pixel constants to keep in
   sync with that CSS by hand. */
function multBoxZone(){
 const mb=document.getElementById('mult-box'), st=document.getElementById('stage');
 if(!mb||!st)return null;
 const mr=mb.getBoundingClientRect(), sr=st.getBoundingClientRect();
 return {top:mr.top-sr.top-10, bottom:mr.bottom-sr.top+10};
}

/* The starfield is fully deterministic (seeded by mountain id) and never
   moves — only its overall brightness (via a separate globalAlpha at the
   call site) changes as the camera climbs. Recomputing all 80-90 star
   positions through the PRNG and re-issuing a beginPath/arc/fill per star
   every single animation frame was pure waste for something that never
   actually changes shape. Render it once to an offscreen canvas (single-
   entry cache, rebuilt only when the id/size/params actually differ — i.e.
   effectively only on resize or mountain switch) and blit it as one
   drawImage per frame instead. Baked at w*DPR/h*DPR with a matching
   internal scale so it stays pixel-crisp on high-DPI screens despite being
   stretched onto the DPR-scaled destination via explicit dw/dh. */
let starFieldCache=null, starFieldKey=null;
function getStarField(id,seedSuffix,w,h,hFrac,count,rScale){
 const key=id+'|'+seedSuffix+'|'+Math.round(w*DPR)+'|'+Math.round(h*DPR)+'|'+hFrac+'|'+count+'|'+rScale;
 if(starFieldKey!==key){
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*DPR));c.height=Math.max(1,Math.round(h*DPR));
  const cctx=c.getContext('2d');
  cctx.scale(DPR,DPR);
  const sf=xmur3(id+seedSuffix);
  for(let i=0;i<count;i++){
   const x=(sf()%10000)/10000*w,y=(sf()%10000)/10000*h*hFrac,r=(sf()%10)/10*rScale+.3;
   cctx.globalAlpha=(sf()%100)/150+.25;
   cctx.fillStyle='#fff';cctx.beginPath();cctx.arc(x,y,r,0,7);cctx.fill();
  }
  starFieldCache=c;starFieldKey=key;
 }
 return starFieldCache;
}

function draw(ts){
 if(!M)return;
 // a brief freeze-frame right on impact — classic game-feel "hit-stop":
 // holding the very last climbing frame on screen for a beat before the
 // fall plays makes the crash land with more weight than an unbroken,
 // continuous animation ever reads as. Summiting skips this on purpose —
 // that moment should flow straight into the reveal, not jar to a stop.
 if(ts<hitStopUntil)return;
 if(phase==='fallen'&&roundSummit){drawSummitReveal(ts);return;}
 const a=M.accent, ppm=PPM(), cy=CY(), cxs=CXS();
 const mbZone=multBoxZone();
 const alt=altOf(mult);
 // how close the live multiplier is to this mountain's ceiling — drives
 // both the climb curve's colour and a low-level tension shake that
 // builds through a climb (see below), same way a classic crash game's
 // line and screen intensity ramp up as the risk does.
 const riskT=clamp(Math.log(Math.max(mult,1))/Math.log(M.ceiling),0,1);
 camAlt=lerp(camAlt,alt,0.22);
 camX  =lerp(camX,faceX(alt),0.22);
 const t=clamp((camAlt-M.base)/(M.elev-M.base),0,1);
 const wx=w=>cxs+(faceX(w)-camX);
 const wy=w=>cy-(w-camAlt)*ppm;

 ctx.save();
 // a subtle, continuously-rising shake as the climb gets riskier — on top
 // of (not replacing) the existing discrete impact shake below, which
 // still decays normally on its own.
 const tension=phase==='climbing'&&!reduceMotion?Math.pow(riskT,3)*2.4:0;
 const totalShake=shake+tension;
 if(totalShake>0.1)ctx.translate((Math.random()-.5)*totalShake,(Math.random()-.5)*totalShake);
 if(shake>0.1)shake*=.88;

 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,mix(M.skyHi,'#000000',t*.40));
 g.addColorStop(.55,mix(M.skyLo,M.skyHi,t*.8));
 g.addColorStop(1,mix(M.skyLo,'#000000',t*.14));
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 ctx.globalAlpha=clamp(t*1.2-.05,0,.9);
 ctx.drawImage(getStarField(M.id,'st',W,H,.72,80,1.3),0,0,W,H);
 ctx.globalAlpha=1;

 ctx.fillStyle='rgba(255,255,255,.07)';
 ctx.beginPath();ctx.moveTo(0,H);
 const df=xmur3(M.id+'d');
 for(let x=0;x<=W;x+=26)
  ctx.lineTo(x,H*.66-Math.abs(Math.sin(x*.005+1.4))*H*.19-((df()%100)/100)*16+t*H*.34);
 ctx.lineTo(W,H);ctx.closePath();ctx.fill();

 /* ── THE FACE ──
    Climbing the mountain's other side, on request: the boundary curve
    itself (facePts, wx()/wy()) is completely untouched — it's still the
    same monotonic left-to-right-rising climb path, so none of the actual
    game math or camera logic changes. All that flips is which side of
    that curve gets painted as solid rock. Was the left (rock mass into
    the hill on the climber's left, open sky on his right); now it's the
    right (rock on his right, sky opens up to his left) — anchored off
    the curve's rightmost extent instead of its leftmost, mirrored the
    same way drawClimber() mirrors the climber sprite itself below.
    The right edge needs no shape of its own for almost the whole climb,
    on request — it just runs straight out to rightAnchor (off past the
    visible canvas edge), filling the screen solidly rather than tracing
    any kind of silhouette. Only right at the very top does it taper back
    in to meet the boundary at M.elev — a flat-topped mesa cut straight
    across at the summit's height (an earlier version, once the taper was
    removed entirely) didn't read as an actual mountain top. PEAK_TAPER_M
    keeps that taper short (a real peak-cap, not the old ~180m gradual
    narrowing this face used to have climbing up to it) so the "just fill
    the screen" behaviour above still holds for effectively the entire
    climb, with only the last few dozen metres actually shaped. */
 const topAlt=camAlt+cy/ppm+50, botAlt=camAlt-(H-cy)/ppm-50;
 const facePts=[];let maxFX=W+60;
 for(let al=topAlt;al>=botAlt;al-=4){
  const x=wx(al),y=wy(al);facePts.push([x,y,al]);if(x>maxFX)maxFX=x;
 }
 const rightAnchor=maxFX+40;
 const PEAK_TAPER_M=45, peakTaperStart=M.elev-PEAK_TAPER_M;
 ctx.beginPath();
 ctx.moveTo(rightAnchor,H+60);
 for(let i=facePts.length-1;i>=0;i--){
  const[x,y,al]=facePts[i];
  let rx=rightAnchor;
  if(al>=M.elev)rx=x;
  else if(al>=peakTaperStart)rx=lerp(rightAnchor,x,ease((al-peakTaperStart)/PEAK_TAPER_M));
  ctx.lineTo(rx,y);
 }
 for(const p of facePts)ctx.lineTo(p[0],p[1]);
 ctx.lineTo(rightAnchor,H+60);ctx.closePath();
 ctx.fillStyle=M.rock;ctx.fill();

 ctx.beginPath();
 let mainStarted=false;
 for(const[x,y,al]of facePts){
  if(al>M.elev)continue;   // never draw the boundary line above the true summit
  mainStarted?ctx.lineTo(x,y):ctx.moveTo(x,y);mainStarted=true;
 }
 if(mainStarted){
  ctx.strokeStyle=a;ctx.globalAlpha=.75;ctx.lineWidth=2;ctx.stroke();
  ctx.globalAlpha=.16;ctx.lineWidth=10;ctx.stroke();ctx.globalAlpha=1;
 }

 // snow/rock texture strokes — extend INTO the rock (now the right side of
 // the boundary, see THE FACE above) instead of leftward. Run all the way
 // up to the true summit now, same as the fill itself does — nothing
 // narrows early any more for them to have to stop clear of.
 // texture stripes stop before the taper zone (peakTaperStart) rather than
 // at M.elev like the fill does — they're a fixed 190px wide, which would
 // visibly overshoot the narrowing rock and poke out into open sky once
 // the right edge actually starts tapering in.
 ctx.globalAlpha=.13;ctx.fillStyle=M.snowC;
 for(let al=Math.floor(botAlt/25)*25;al<topAlt;al+=25){
  if(al>=peakTaperStart)continue;
  const y=wy(al),x=wx(al);
  ctx.fillRect(x,y,190,2.6);
 }
 ctx.globalAlpha=1;

 ctx.strokeStyle='rgba(255,255,255,.10)';ctx.lineWidth=1;
 for(let al=Math.floor(botAlt/60)*60;al<topAlt;al+=60){
  if(al>=peakTaperStart)continue;
  const y=wy(al),x=wx(al);
  ctx.beginPath();ctx.moveTo(x+170,y+20);ctx.lineTo(x,y);ctx.stroke();
 }

 /* Ruler ticks every 10m (was 100m) — with no hard multiplier cap any
    more, the climb can spend a long stretch of a round compressed into a
    tiny sliver of altitude near/above a mountain's `ceiling` (see
    CLIMB_TREF). 100m ticks would show nothing moving at all through that
    whole stretch; 10m ticks still visibly advance, so there's always a
    felt sense of "still climbing" even while the number keeps racing up
    far faster than the ruler does. Labelling every one of those, though,
    put 20+ overlapping "5,xxx m" strings on screen at once — unreadable.
    So: a short unlabelled mark every 10m for the felt motion, a full
    labelled tick only every 50m for something actually legible. */
 // ruler ticks/labels live in the open sky side — now the LEFT of the
 // boundary (see THE FACE above), so every offset here points negative
 // instead of positive.
 ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1;
 for(let al=Math.ceil(botAlt/10)*10;al<topAlt;al+=10){
  if(al>M.elev||al%50===0)continue;   // the %50 marks get the full labelled tick below
  const y=wy(al),x=wx(al);
  ctx.beginPath();ctx.moveTo(x-13,y);ctx.lineTo(x-24,y);ctx.stroke();
 }
 ctx.font='600 11px "JetBrains Mono",monospace';
 ctx.textAlign='right';
 for(let al=Math.ceil(botAlt/50)*50;al<topAlt;al+=50){
  if(al>M.elev)continue;   // no ruler ticks above the true summit — nothing there to mark
  const y=wy(al),x=wx(al);
  // skip the whole labelled tick — line and text together — if it would
  // land behind #mult-box: the label text is what actually read as messy
  // crossing through the multiplier/countdown readout (reported live),
  // and a bare tick mark with no label looks like an accidental stray
  // line rather than a deliberate one. The 10m unlabelled ticks above
  // still show through this same band, so motion doesn't visibly pause.
  if(mbZone&&y>=mbZone.top&&y<=mbZone.bottom)continue;
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x-5,y);ctx.lineTo(x-30,y);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.78)';ctx.fillText(Math.round(al).toLocaleString()+' m',x-36,y+4);
 }
 ctx.textAlign='left';

 /* the climb curve — the classic crash-game "rising line" (Aviator/
    Bustabit etc.), drawn right over the actual climb path instead of as
    a separate abstract chart, since here the climb genuinely IS the
    curve. Colour eases from the mountain's own accent toward danger-red
    as the multiplier nears ceiling, with a gradient fill under the line
    and a glowing leading dot — the genre's signature look, laid onto the
    mountain instead of replacing it. */
 if(trail.length>1){
  const rc=hexRGB(a), dc=hexRGB('#ef4444');
  const lr=Math.round(lerp(rc[0],dc[0],riskT)), lg=Math.round(lerp(rc[1],dc[1],riskT)), lb=Math.round(lerp(rc[2],dc[2],riskT));
  const lineRGB=phase==='fallen'?'239,68,68':`${lr},${lg},${lb}`;
  const pts=trail.map(al=>[wx(al)-15,wy(al)]);
  const lastX=pts[pts.length-1][0], lastY=pts[pts.length-1][1];

  /* the fill's bottom edge has to be the trail's OWN starting altitude
     (pts[0]), not the bottom of the canvas — early in a climb the trail
     only covers a few metres near the climber, and closing the shape all
     the way down to the canvas edge regardless stretched a thin sliver
     of colour off the bottom of the screen that read as the climber
     trailing/lagging downward, not as an area-under-the-curve fill. */
  const baseY=pts[0][1];
  ctx.beginPath();
  ctx.moveTo(pts[0][0],baseY);
  for(const[x,y]of pts)ctx.lineTo(x,y);
  ctx.lineTo(lastX,baseY);
  ctx.closePath();
  const fg=ctx.createLinearGradient(0,lastY,0,baseY);
  fg.addColorStop(0,`rgba(${lineRGB},.30)`);
  fg.addColorStop(1,`rgba(${lineRGB},0)`);
  ctx.fillStyle=fg;ctx.fill();

  ctx.beginPath();
  for(let i=0;i<pts.length;i++) i===0?ctx.moveTo(pts[i][0],pts[i][1]):ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.strokeStyle=`rgb(${lineRGB})`;
  ctx.globalAlpha=.18;ctx.lineWidth=8;ctx.stroke();
  ctx.globalAlpha=.9;ctx.lineWidth=2.2;ctx.stroke();
  ctx.globalAlpha=1;

  if(phase==='climbing'){
   ctx.beginPath();ctx.arc(lastX,lastY,8,0,7);
   ctx.fillStyle=`rgba(${lineRGB},.28)`;ctx.fill();
   ctx.beginPath();ctx.arc(lastX,lastY,4.5,0,7);
   ctx.fillStyle=`rgb(${lineRGB})`;ctx.fill();
  }
 }

 const flagY=wy(M.elev);
 if(M.elev-camAlt<cy/ppm){
  const sy=flagY,sx=wx(M.elev);
  ctx.strokeStyle=a;ctx.globalAlpha=.85;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx,sy-17);ctx.stroke();
  ctx.fillStyle=a;ctx.beginPath();
  // flag faces into open sky, which is now the left side of the pole
  // (see THE FACE above) instead of the right.
  ctx.moveTo(sx,sy-17);ctx.lineTo(sx-12,sy-13.5);ctx.lineTo(sx,sy-10);ctx.closePath();ctx.fill();
  // flag pole/triangle always draws — only the text label (the part that
  // actually reads as messy crossing through #mult-box) skips when it
  // would land behind it, same reasoning as the ruler labels above.
  if(!(mbZone&&sy-12>=mbZone.top&&sy-12<=mbZone.bottom)){
   ctx.fillStyle=a;ctx.font='700 11px "JetBrains Mono",monospace';
   ctx.textAlign='right';
   ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=6;
   ctx.fillText('SUMMIT '+M.ceiling.toFixed(0)+'×',sx-17,sy-12);ctx.shadowBlur=0;
   ctx.textAlign='left';
  }
  ctx.globalAlpha=1;
 }

 /* Keep his head visibly below the summit flag until he's genuinely up
    there — reaching the true top is a discrete, server-granted event
    (drawSummitReveal renders that moment separately; this function only
    ever runs while he's NOT yet summited), but altOf()'s display curve
    can legitimately bring his numeric altitude within just a few metres
    of M.elev while community progress sits parked in the push zone (see
    altOf's own reserve comment) — a gap that's still several pixels on
    a normal canvas, except the climber's head and the flag's pole are
    both drawn at FIXED pixel heights above their own anchor points,
    never scaled by how many metres of gap actually remain, so a small
    enough metre-gap can still let his head visually poke above/through
    the flag despite him genuinely not being there yet.
    A first version of this clamped only the Y pixel, leaving X at
    wx(alt) — the true, unclamped altitude. That decoupled his two
    coordinates: the rock face's boundary curves and tapers as it nears
    the peak (see buildFace/faceX), so an (x from one altitude, y from a
    DIFFERENT, lower one) pair doesn't generally land back on that curve
    at all — he rendered floating off the rock face instead of standing
    on it, especially right where the taper is most pronounced. Deriving
    BOTH x and y from one shared clamped altitude keeps him exactly where
    the boundary curve actually is at that altitude, same as every other
    point drawn this way. fscale mirrors drawClimber's own — smaller
    clearance on a short canvas, where the flag/head are already drawn
    smaller too — so the metres this holds him back by don't balloon on
    mobile the way a flat pixel clearance would once divided by a small
    ppm. */
 const fscale=clamp(H/500,0.6,1);
 const clearancePx=26+16*fscale;
 const renderAlt=Math.min(alt,M.elev-clearancePx/ppm);
 drawClimber(wx(renderAlt),wy(renderAlt),alt,ts,t);

 const vg=ctx.createRadialGradient(W/2,H*.5,H*.2,W/2,H*.5,H*.86);
 vg.addColorStop(0,'rgba(0,0,0,0)');
 vg.addColorStop(1,`rgba(0,0,0,${.14+t*.20})`);
 ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

 if(alt>7000&&phase==='climbing'&&!reduceMotion){
  const p=(alt-7000)/(M.elev-7000);
  ctx.globalAlpha=.06*p*(.5+Math.sin(ts*.004)*.5);
  ctx.fillStyle='#ef4444';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
 }
 if(flash>.01){ctx.globalAlpha=flash*.5;ctx.fillStyle=flashColor;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;flash*=.9;}
 ctx.restore();
}

/* One burst of confetti for the summit reveal — spawned once right as
   the reveal begins (see handleRoundEnd), then just falls and fades
   here every frame until it's off the bottom of the screen. */
function spawnConfetti(){
 confetti=[];
 if(reduceMotion)return;
 const colors=[M.accent,'#fbbf24','#fff','#f87171','#60a5fa'];
 for(let i=0;i<140;i++){
  confetti.push({
   x:Math.random()*W, y:-20-Math.random()*H*0.5,
   vx:(Math.random()-0.5)*1.6, vy:1.6+Math.random()*2.2,
   size:3+Math.random()*4, rot:Math.random()*7, vr:(Math.random()-0.5)*0.3,
   color:colors[Math.floor(Math.random()*colors.length)],
   shape:Math.random()<0.5?'rect':'circle'
  });
 }
}

/* Reaching the true ceiling is the one moment the mountain shows its
   whole shape — full silhouette, base to apex, rather than the
   windowed cliff-face view used while actually climbing. This reuses
   the same two-sided triangle technique the home-card thumbnails
   already draw safely; it's deliberately NOT built on the panning
   single-boundary face model (see buildFace's comment) since that's
   what caused the earlier topology bugs — this view is a static
   freeze-frame, never panned or re-anchored, so none of that risk
   applies here. Shown for the round-end pause whenever a round's own
   crash point reaches the true ceiling, which is exactly the event
   that also closes out the jackpot (see handleRoundEnd, and the
   server's own settlement logic in backend/src/game/room.js). */
function drawSummitReveal(ts){
 const a=M.accent;
 ctx.save();
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,M.skyHi);g.addColorStop(1,M.skyLo);
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 ctx.drawImage(getStarField(M.id,'summitst',W,H,.6,90,1.4),0,0,W,H);

 const apexX=W*0.5, apexY=H*0.16, baseY=H*0.95;
 const baseL=-W*0.1, baseR=W*1.1;
 const sdL=xmur3(M.id+'revL'), sdR=xmur3(M.id+'revR');
 const N=60, run=[0]; let acc=0;
 for(let i=1;i<=N;i++){acc+=lerp(0.003,0.030,profileT(M,i/N));run.push(acc);}
 const total=run[N];
 ctx.beginPath();ctx.moveTo(baseL,baseY);
 for(let i=0;i<=N;i++){
  const tt=i/N, frac=run[i]/total;
  const x=baseL+frac*(apexX-baseL), y=baseY-tt*(baseY-apexY);
  const jag=((sdL()%1000)/1000-.5)*.015*W*(1-tt*.6);
  ctx.lineTo(x+jag,y);
 }
 for(let i=N-1;i>=0;i--){
  const tt=i/N, frac=run[i]/total;
  const x=baseR-frac*(baseR-apexX), y=baseY-tt*(baseY-apexY);
  const jag=((sdR()%1000)/1000-.5)*.015*W*(1-tt*.6);
  ctx.lineTo(x+jag,y);
 }
 ctx.lineTo(baseR,baseY);ctx.closePath();
 ctx.fillStyle=M.rock;ctx.fill();
 ctx.strokeStyle=a;ctx.globalAlpha=.75;ctx.lineWidth=3;ctx.stroke();ctx.globalAlpha=1;

 ctx.strokeStyle='#e8eef7';ctx.globalAlpha=.9;ctx.lineWidth=2.2;
 ctx.beginPath();ctx.moveTo(apexX,apexY);ctx.lineTo(apexX,apexY-34);ctx.stroke();
 ctx.fillStyle=a;ctx.beginPath();
 ctx.moveTo(apexX,apexY-34);ctx.lineTo(apexX+24,apexY-27);ctx.lineTo(apexX,apexY-20);ctx.closePath();ctx.fill();
 ctx.globalAlpha=1;

 /* the screen-wide gold flash (set in handleRoundEnd) already covers the
    "burst of light" moment — a ring drawn around the climber on top of
    that read as a floating halo/portal rather than a celebration, so the
    impact is left to the flash + confetti + shake + sound instead. */

 // +10 here, not -10: drawClimber's own internal anchor offset is negative
 // (mirrored sprite, standing toward open air — see its own comment), so
 // this caller-side offset has to be the opposite sign to still land him
 // next to the flag instead of off to one side of it. Kept in sync with
 // that anchor's own magnitude (currently -10, see drawClimber).
 drawClimber(apexX+10,apexY+4,M.elev,ts,1);

 for(let i=confetti.length-1;i>=0;i--){
  const p=confetti[i];
  p.x+=p.vx;p.y+=p.vy;p.vy+=0.045;p.rot+=p.vr;
  if(p.y>H+20){confetti.splice(i,1);continue;}
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
  ctx.fillStyle=p.color;ctx.globalAlpha=.92;
  if(p.shape==='rect')ctx.fillRect(-p.size/2,-p.size*0.35,p.size,p.size*0.7);
  else{ctx.beginPath();ctx.arc(0,0,p.size*0.45,0,7);ctx.fill();}
  ctx.restore();
 }
 ctx.globalAlpha=1;

 ctx.restore();
}

/* ═══ CLIMBER — side-on, four-beat gait ═══ */
function limbPos(u,reach){
 if(u<0.28){const e=ease(u/0.28);return lerp(reach*0.42,-reach*0.42,e);}
 return lerp(-reach*0.42,reach*0.42,(u-0.28)/0.72);
}
function drawClimber(ex,ey,alt,ts,t){
 const climbing=phase==='climbing', fallen=phase==='fallen';
 const shallow=profileT(M,t);
 /* Shared with the body's own ctx.scale() below — how much smaller
    everything about the climber should be on a short canvas (see that
    line's comment). Hoisted up here too because the fall/rope-hang
    animation just below has its own set of fixed-pixel distances
    (dropX/dropY/swayX) that need the same treatment: unscaled, they
    swing him a constant ~50-90px away from the rock on ANY canvas size,
    which read as fine against the old, taller desktop-sized mobile stage
    but reads as him floating away from the mountain entirely now that
    the mobile stage is much shorter — the same fixed-pixel-vs-shrunk-
    canvas mismatch the body scale below already fixes, just for the
    fall's travel distance instead of the body's own size. */
 const fscale=clamp(H/500,0.6,1);
 /* the height/terrain-based pacing below (lerp(0.85,0.34,t)) deliberately
    gives a "getting tired" feel as the climb gets higher — but it's blind
    to how fast the round is ACTUALLY moving. A round accelerating hard
    (a big multiplier surge) could still show a slow, tired-looking shuffle
    purely because of where on the mountain it happened to be, which read
    as the climber randomly slowing or stalling while the number kept
    racing up. Track real on-screen altitude velocity and let it set a
    FLOOR under the gait rate — never slower than the pace actually
    warrants, while leaving the original height-based pacing untouched
    for genuinely slow stretches of a climb. */
 if(velAlt===null){velAlt=alt;velTs=ts;}
 const dtv=ts-velTs;
 if(climbing&&dtv>16){
  const inst=Math.max((alt-velAlt)/(dtv/1000),0);
  climbVel=lerp(climbVel,inst,clamp(dtv/220,0,1));
  velAlt=alt;velTs=ts;
 } else if(!climbing){
  climbVel=0;velAlt=alt;velTs=ts;
 }
 const refVel=(M.elev-M.base)/45;   // "climbing the whole mountain in ~45s" as a 1.0x pace reference
 const velFactor=clamp(climbVel/Math.max(refVel,1),0,1.3);
 const rate=climbing?Math.max(lerp(0.85,0.34,t)*lerp(0.55,1.3,shallow),velFactor)*1.9:0.09;
 gait=(gait+rate*0.016)%1;
 // Cap raised from 0.34 (~19.5°) to 0.46 (~26°) — on the steep/near-vertical
 // stretches near a summit the old cap left him standing almost bolt
 // upright regardless of how overhanging the rock actually was, which read
 // as facing away from the wall rather than leaning into it.
 const lean=clamp(0.06+slopeAngle(alt)*0.3,0,0.46);
 /* "fallen" covers BOTH a real crash and a summit — only a real crash
    should look dead (red, tumbling); reaching the top should still look
    triumphant, not like he just died at the exact moment he made it. */
 const falling=fallen&&!roundSummit;
 const fallEl=falling?Math.max(0,(ts-fallTS)/1000):0;
 /* A real fall used to just tumble off-screen forever (dropX/dropY grew
    unbounded with fallEl²), with nothing on screen tying that motion back
    to where the NEXT round actually starts — the community climb persists
    at exactly the fall altitude (see visualAltOf in room.js), so the
    climber picking back up from open space read as disconnected from
    that. Capping the freefall at ROPE_CATCH and settling into a taut,
    gently swinging hang instead gives the fall a visible anchor point:
    this is where he's caught, and where next round resumes. */
 const ROPE_CATCH=0.55, ROPE_SETTLE=0.5;
 const fallClamped=falling?Math.min(fallEl,ROPE_CATCH):0;
 const dropX=fallClamped*95*fscale, dropY=170*fallClamped*fallClamped*fscale;
 const caught=falling&&fallEl>ROPE_CATCH;
 const hangEl=caught?fallEl-ROPE_CATCH:0;
 const hangT=caught?clamp(hangEl/ROPE_SETTLE,0,1):0;
 /* Two layered oscillations once caught, instead of one plain decaying
    sine, so the catch reads as an actual jerk of tension rather than
    motion just gently stopping: `twang` is fast and sharply-decaying —
    the initial elastic jolt — and `swing` is the slower pendulum settle
    that follows it. Both drive the rope, the body's rotation, AND a
    little lateral drift together, so all three read as one coherent
    hang instead of independently-animated parts. swing/twang themselves
    stay unscaled — they also drive hangRot below, a rotation ANGLE, which
    has no pixel size to shrink — only their contribution to swayX (a
    position offset) gets fscale applied, same reasoning as dropX/dropY. */
 const twang=caught?Math.sin(hangEl*30)*7*Math.exp(-hangEl*9):0;
 const swing=caught?Math.sin(hangEl*2.6)*0.3*Math.exp(-hangEl*1.1):0;
 const swayX=caught?(swing*26+twang)*fscale:0;
 // once settled into the hang, the panic-red fades to a calm, neutral
 // tone rather than snapping between the two — mix() is the same hex
 // interpolation helper the sky gradient uses.
 const col=falling?mix('#ef4444','#cbd5e1',hangT):'#fff';
 const dangerCol=neutral=>falling?mix('#ef4444',neutral,hangT):neutral;
 const rope=M.accent;
 // -15 (an earlier -6 let the torso/aura clearly overlap the rock, but
 // let the LEGS and dangling rope — reaching about as far as the aura's
 // own ~16-unit radius — cross fully INTO it, visibly drawn over solid
 // ground) fixed the legs but overcorrected the opposite way: with legs
 // and arms both tuned to just reach the boundary FROM this anchor, the
 // hip/torso/head/aura — everything drawn near local x=0, i.e. close to
 // this anchor itself — sat a full 15 local units back from the rock in
 // open air, reading as the whole body core floating detached with only
 // fingertip/toe contact (reported live: "the climber is detached").
 // -10 splits the difference: still far enough back that the legs (see
 // their own shortened local reach below) can't overshoot into the rock,
 // but close enough that the torso/head/aura — the parts a player's eye
 // actually reads as "the climber" — sit right up against the boundary
 // instead of hanging a visibly separate 15 units short of it.
 const bx=ex-10-dropX-swayX, by=ey-2+dropY;

 if(falling){
  if(caught&&!ropeCaught){
   // one-shot "thud" the instant the rope actually bites — a handful of
   // knocked-loose chalk/ice puffs plus a quick, separate shake pulse
   // (the initial crash shake has long since decayed away by ROPE_CATCH).
   ropeCaught=true;
   shake=Math.max(shake,5);
   for(let i=0;i<7;i++)
    puffs.push({x:bx,y:by,r:1+Math.random()*1.2,o:.5,
     vx:(Math.random()-0.5)*1.8,vy:-0.3-Math.random()*0.6,ice:true});
  }
  /* the rope, drawn in world space back to the exact point he fell from —
     visible slack while still in freefall, whipping taut with a brief
     overshoot the instant it catches. A soft glow pass under a crisp
     core plus a thin bright highlight — the same double-stroke treatment
     the rest of the mountain's line work already uses — reads as an
     actual rope rather than a flat single-width line, and a small
     carabiner marks the anchor point. */
  const ax=ex-15, ay=ey-2;
  const midX=(ax+bx)/2+(1-hangT)*16, midY=(ay+by)/2;
  ctx.save();
  ctx.lineCap='round';
  ctx.strokeStyle=rope;
  ctx.globalAlpha=.18;ctx.lineWidth=4.5;
  ctx.beginPath();ctx.moveTo(ax,ay);ctx.quadraticCurveTo(midX,midY,bx,by);ctx.stroke();
  ctx.globalAlpha=.8;ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(ax,ay);ctx.quadraticCurveTo(midX,midY,bx,by);ctx.stroke();
  ctx.globalAlpha=.55;ctx.lineWidth=.6;ctx.strokeStyle='#fff';
  ctx.beginPath();ctx.moveTo(ax,ay);ctx.quadraticCurveTo(midX,midY,bx,by);ctx.stroke();
  ctx.globalAlpha=1;
  ctx.fillStyle='#8b96a8';ctx.beginPath();ctx.arc(ax,ay,2.6,0,7);ctx.fill();
  ctx.strokeStyle='#e2e8f0';ctx.globalAlpha=.9;ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(ax,ay,2.6,0,7);ctx.stroke();ctx.globalAlpha=1;
  ctx.restore();
 }

 ctx.save();
 ctx.translate(bx,by);
 /* The climber's body is drawn at fixed pixel sizes (R=15, the various
    -16/-17/-2.5 offsets below, etc.) — a constant regardless of how big
    or small #stage's box actually is, unlike the mountain/terrain, which
    already scales naturally with canvas height via PPM=H/210. Shrinking
    #stage for the mobile layout left the climber's own fixed-pixel size
    unchanged, so on a short mobile canvas he now reads as oversized
    against the (correspondingly smaller-looking) mountain. Scaling this
    down with fscale (floored at 0.6, capped at 1 — see fscale's own
    comment above) keeps him a consistent fraction of the mountain at any
    canvas size instead of a fixed pixel size, while desktop's already-
    tuned look (1.2 overall) is completely unchanged — desktop's #stage is
    tall enough to clear fscale's divisor easily either way, so it always
    lands on the fscale=1 cap regardless of exactly where that divisor is
    set. fscale's divisor was raised from an original 300 to 500 once the
    mobile #stage itself grew (see #stage's own comment in the mobile
    media query) — mobile canvas heights that now regularly approach or
    pass the old 300px threshold were hitting that same fscale=1 desktop
    cap on a canvas still nowhere near desktop-sized, reading as oversized
    again. Raising the divisor keeps fscale meaningfully below 1 across
    today's whole mobile height range, only reaching desktop's full size
    at genuinely desktop-scale canvas heights. */
 const climberScale=fscale*1.2;
 /* Negative x-scale mirrors the ENTIRE climber as one unit — every limb,
    the ice axe, the backpack, the whole gait — rather than hand-flipping
    each of the dozen-plus fixed left-leaning offsets below individually
    (they're all authored assuming the rock is on his left, e.g. the axe
    swings in at -11/-14; a single mirror here reaches the same "rock on
    his right" result with no risk of missing one). Placed before rotate()
    below on purpose: it needs to mirror the lean/tumble rotation along
    with the body, not just the body shape on its own, so leaning "into
    the slope" still tilts the right way once the rock itself has moved
    to his other side — mirroring afterwards instead would leave him
    leaning into empty air. */
 ctx.scale(-climberScale,climberScale);
 /* fallen-but-not-falling is exclusively the summit pose (falling is
    fallen&&!roundSummit, so the only way to be fallen without falling is
    roundSummit) — that used to reuse a "settling on the ground" tilt of
    over a full radian, which is why it looked like he'd collapsed even
    once the colour was fixed. A standing climber gets a small idle sway
    instead, same as the resting sway used mid-climb, just upright. Once
    the rope catches a real fall, the tumble rotation eases into a gentle,
    decaying pendulum swing around a settled hanging tilt instead of
    spinning forever. */
 const tumbleRot=1.1+fallClamped*5.2+Math.sin(ts*0.02)*0.25;
 const hangRot=0.55+swing+twang*0.02;
 ctx.rotate(falling?lerp(tumbleRot,hangRot,hangT):fallen?Math.sin(ts*0.0018)*0.09:lean);
 ctx.lineCap='round';ctx.lineJoin='round';

 /* this soft aura is meant to ground the climber against the rock during
    normal close-up climbing — at the summit reveal's zoomed-out full-
    mountain scale that same fixed 19px circle dwarfs the tiny climber
    sprite and reads as a dark blob/portal around him instead, which is
    exactly the "looks weird" complaint. Only draw it up close. */
 if(!(fallen&&!falling)){
  ctx.globalAlpha=.15;ctx.fillStyle=dangerCol(rope);
  ctx.beginPath();ctx.arc(0,-8,19,0,7);ctx.fill();ctx.globalAlpha=1;
 }

 if(!fallen){
  ctx.strokeStyle=rope;ctx.globalAlpha=.42;ctx.lineWidth=1.1;
  ctx.beginPath();ctx.moveTo(-2,2);ctx.quadraticCurveTo(-14,20,-8,42);ctx.stroke();ctx.globalAlpha=1;
 }

 const R=15;
 let yRH=limbPos(gait,R), yLF=limbPos((gait+.25)%1,R),
     yLH=limbPos((gait+.5)%1,R), yRF=limbPos((gait+.75)%1,R);
 const mv=u=>u<0.28;
 let swRH=mv(gait), swLF=mv((gait+.25)%1), swLH=mv((gait+.5)%1), swRF=mv((gait+.75)%1);
 /* `rate` above never actually drops to 0 once off the wall (it's a
    constant idle 0.09 for every non-climbing phase), so the summit
    reveal used to keep running the same four-beat climbing gait forever
    — "reaching the top" visibly kept climbing in place instead of
    celebrating. Plant both feet and thrust both arms up into a fist-pump
    instead, with a slow bounce so it still reads as alive rather than a
    frozen screenshot. */
 if(fallen&&!falling){
  const pump=Math.sin(ts*0.0032)*3;
  yLF=0;yRF=0;swLF=false;swRF=false;
  yRH=-R*1.35+pump;yLH=yRH;swRH=false;swLH=false;
 }

 // Reach shortened by ~4 local units (13.5/12.5 -> 9.5/8.5, etc) to match
 // the anchor moving from -15 to -10 above — keeps the feet crossing the
 // boundary by about the same small margin as before instead of
 // overshooting 4 units deeper into the rock now that they start closer.
 ctx.strokeStyle=col;ctx.lineWidth=2.7;
 ctx.globalAlpha=.62;
 ctx.beginPath();ctx.moveTo(0,3);
 ctx.lineTo(-3+(swRF?3:0),3+yRF*.5+7);ctx.lineTo(-9.5,3+yRF+10);ctx.stroke();
 ctx.globalAlpha=1;
 ctx.beginPath();ctx.moveTo(0,3);
 ctx.lineTo(-2+(swLF?4:0),3+yLF*.5+7);ctx.lineTo(-8.5,3+yLF+10);ctx.stroke();

 if(!fallen){
  ctx.fillStyle=M.snowC;ctx.globalAlpha=.5;
  ctx.fillRect(-12,3+yLF+9,3.5,1.6);
  ctx.fillRect(-13,3+yRF+9,3.5,1.6);
  ctx.globalAlpha=1;
 }

 ctx.lineWidth=3.6;
 ctx.beginPath();ctx.moveTo(0,3);ctx.lineTo(-2,-9);ctx.stroke();

 ctx.fillStyle=dangerCol(rope);
 ctx.globalAlpha=.88;
 ctx.save();ctx.translate(3.2,-5);ctx.rotate(.12);
 ctx.beginPath();ctx.roundRect(0,-4,5,10,1.6);ctx.fill();ctx.restore();
 ctx.globalAlpha=1;

 // Hands/ice-axe reach further than the legs on purpose — matching magnitudes
 // is exactly what put the legs INSIDE the rock at a small standing offset
 // (see that offset's own comment above). The arms get their own, longer
 // local reach so they still visibly cross the boundary and grip the rock
 // instead of stopping just short of it in open air.
 ctx.strokeStyle=col;ctx.lineWidth=2.5;
 ctx.globalAlpha=.62;
 ctx.beginPath();ctx.moveTo(-2,-7);
 ctx.lineTo(-11+(swRH?4:0),-7+yRH*.55-3);ctx.lineTo(-16,-7+yRH-6);ctx.stroke();
 ctx.globalAlpha=1;
 ctx.beginPath();ctx.moveTo(-2,-7);
 ctx.lineTo(-10+(swLH?5:0),-7+yLH*.55-3);ctx.lineTo(-15,-7+yLH-6);ctx.stroke();

 ctx.strokeStyle=dangerCol('#9aa8bd');ctx.lineWidth=1.9;
 ctx.beginPath();ctx.moveTo(-16,-7+yRH-6);ctx.lineTo(-20,-7+yRH-9.5);ctx.stroke();
 ctx.beginPath();ctx.moveTo(-15,-7+yLH-6);ctx.lineTo(-19,-7+yLH-9.5);ctx.stroke();

 ctx.fillStyle=col;
 ctx.beginPath();ctx.arc(-2.5,-13.5,4.1,0,7);ctx.fill();
 ctx.fillStyle=dangerCol('#0d1626');
 ctx.save();ctx.translate(-2.5,-14);ctx.rotate(.1);ctx.fillRect(-3.4,-1.3,6.8,2.5);ctx.restore();
 ctx.restore();

 // ice chips off the rock (now his right, see THE FACE in draw()) drift
 // further right; breath vapour into open sky (now his left) drifts left.
 if(climbing&&(swRH||swLH)&&Math.random()<.22)
  puffs.push({x:ex+4,y:ey-16+Math.random()*8,r:1,o:.55,vx:.6+Math.random(),vy:.5+Math.random(),ice:true});
 if(climbing&&t>.3&&Math.random()<.05)
  puffs.push({x:ex-11,y:ey-14,r:1.6,o:.42,vx:-1,vy:-.25,ice:false});
 for(let i=puffs.length-1;i>=0;i--){
  const p=puffs[i];
  p.x+=p.vx;p.y+=p.vy;p.r+=p.ice?.1:.55;p.o-=p.ice?.03:.014;
  if(p.o<=0){puffs.splice(i,1);continue;}
  ctx.globalAlpha=p.o;ctx.fillStyle=p.ice?M.snowC:'#fff';
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
 }
 ctx.globalAlpha=1;
}

function updJackpotUI(){
 if(!M)return;
 /* M.progress (the long-term community climb) only ratchets forward once
    a round actually ends — but the climber sprite and the "CURRENT
    HEIGHT" HUD both already show this round's live position while it's
    still climbing, which made this box look frozen well below where the
    climber visibly was. A round can only ever end at or above its live
    position (mult only ever increases), so showing that live position
    here early is never overstating anything — it's exactly what this
    will become the moment the round settles. */
 const liveProgress=phase==='climbing'?clamp(altOf(mult)-M.base,0,M.elev-M.base):(M.progress||0);
 const frac=clamp(liveProgress/(M.elev-M.base),0,1);
 const push=frac>=SUMMIT_PUSH_FRAC&&frac<1;
 document.getElementById('jk-amt').textContent=f2(M.jackpot);
 document.getElementById('jackpot').classList.toggle('push',push);
 document.getElementById('jk-lab').textContent=push?'🚨 SUMMIT PUSH':'🎰 SUMMIT JACKPOT';
 document.getElementById('jk-sub').textContent=push
  ?'🚩 climber at '+Math.round(M.base+liveProgress).toLocaleString()+' m — final push, small chance of a late fall'
  :'🧗 climber at '+Math.round(M.base+liveProgress).toLocaleString()+' m of '+M.elev.toLocaleString()+' m';
 document.getElementById('jk-progress-fill').style.width=(frac*100)+'%';
 document.getElementById('jk-progress-pct').textContent=Math.round(frac*100)+'%';
}

 document.getElementById('bet'+i).innerHTML=`

  <div class="bet-body">
   <div class="bet-controls">
    <div class="row">
     <div class="fld"><div class="fld-l">AMOUNT (TKN)</div>
      <div class="amt-wrap">
       <button type="button" class="amt-stp" onclick="qstep(${i},-1)" aria-label="Decrease stake">−</button>
       <input type="number" id="s${i}" value="10" min="1" step="1">
       <button type="button" class="amt-stp" onclick="qstep(${i},1)" aria-label="Increase stake">+</button>
      </div>
     </div>
    </div>
    <div class="qk">
     <button onclick="qm(${i},.5)">½</button><button onclick="qm(${i},2)">2×</button>
     <button onclick="qs(${i},50)">50</button><button onclick="qs(${i},200)">200</button>
     <button onclick="qx(${i})">MAX</button>
    </div>
    <div class="qk qk-preset">
     <button onclick="qs(${i},10)">10</button>
     <button onclick="qs(${i},50)">50</button>
     <button onclick="qs(${i},200)">200</button>
     <button onclick="qs(${i},500)">500</button>
     <button class="qk-max" onclick="qx(${i})">MAX</button>
    </div>
   </div>
   <button class="act place" id="b${i}">PLACE STAKE</button>
  </div>`;
 document.getElementById('b'+i).onclick=()=>betAction(i);
 updBet(i);
}
function updBet(i){
 const b=bets[i],btn=document.getElementById('b'+i),st=document.getElementById('bs'+i);
 if(!btn)return;
 let cls='place',txt='PLACE STAKE',s='',sc='var(--dim)';
 if(b){
  if(b.state==='pending'){cls='queued';txt='PLACING…';s='PENDING';sc='#7dd3fc';}
  else if(b.state==='queued'){cls='queued';txt='✕ CANCEL · '+f2(b.stake)+' TKN';s='QUEUED';sc='#7dd3fc';}
  else if(b.state==='next'){cls='queued';txt='✕ CANCEL NEXT · '+f2(b.stake);s='NEXT ROUND';sc='#818cf8';}
  else if(b.state==='live'){cls='cash';txt='TAKE · '+fx(mult);s='CLIMBING';sc='var(--gn)';}
  else if(b.state==='cashed'){cls='done';txt='✓ +'+f2(b.payout)+' TKN';s='TAKEN @ '+fx(b.cashMult);sc='var(--gn)';}
  else if(b.state==='lost'){cls='dead';txt=b.refund>0?'FELL · '+f2(b.refund)+' BACK':'FELL AT '+fx(crashAt);s='FELL';sc='var(--rd)';}
 } else if(phase==='climbing'||phase==='fallen'){cls='next';txt='STAKE NEXT ROUND';}
 btn.className='act '+cls;btn.textContent=txt;
 st.textContent=s;st.style.color=sc;
}
function updBetLive(i){
 const b=bets[i];
 if(b&&b.state==='live'){const btn=document.getElementById('b'+i);if(btn)btn.textContent='TAKE · '+fx(mult);}
}
function qm(i,f){const e=document.getElementById('s'+i);e.value=Math.max(1,Math.round(+e.value*f));}
function qs(i,v){document.getElementById('s'+i).value=v;}
function qx(i){document.getElementById('s'+i).value=Math.floor(balance);}
function qstep(i,delta){const e=document.getElementById('s'+i);e.value=Math.max(1,Math.round((+e.value||0)+delta));}

function betAction(i){
 const b=bets[i];
 if(b&&b.state==='live'){cashOut(i);return;}
 if(b&&(b.state==='queued'||b.state==='next')){cancelStake(i);return;}
 if(b&&(b.state==='pending'||b.state==='cashed'||b.state==='lost'))return;
 if(!myUser){toast('Still connecting — try again in a moment','i');return;}
 const s=+document.getElementById('s'+i).value||0;
 if(s<=0){toast('Enter a stake amount','i');return;}
 if(s>balance){toast('Insufficient balance','l');return;}
 ensureAudio();sfxBet();
 placeStake(i,s);
 if(phase!=='waiting')toast('Staked for the next ascent','i');
}
/* Sends the stake to the server and shows it as pending immediately for
   responsiveness — but never touches `balance` locally. The server is the
   only place that ever mutates an account's balance; the client waits for
   the 'balance' message it sends back once the debit actually happens. */
function placeStake(i,stake){
 bets[i]={stake,state:'pending',cashMult:null,payout:0,refund:0};
 updBet(i);
 wsSend({type:'bet',mountainId:M.id,slot:i,stake});
}
function cancelStake(i){
 wsSend({type:'cancelBet',mountainId:M.id,slot:i});
}
function cashOut(i){
 const b=bets[i];
 if(!b||b.state!=='live'||phase!=='climbing')return;
 wsSend({type:'cashOut',mountainId:M.id,slot:i});
}
function updBal(){
 document.getElementById('bal').textContent=f2(balance);
}
async function topUp(){
 if(!myUser){toast('Still connecting — try again in a moment','i');return;}
 try{
  const res=await fetch('/api/topup',{method:'POST',credentials:'same-origin'});
  const data=await res.json();
  if(!res.ok){toast(data.message||'Faucet unavailable','l');return;}
  balance=data.balance;updBal();
  toast('+1,000.00 TKN added (demo faucet)','i');
 }catch(e){toast('Faucet unavailable','l');}
}

/* Backing store for the All Bets/Previous/Top tabs — every cashout/loss
   this mountain sees, newest first, tagged with the round `nonce` it
   belongs to so the tabs can slice it three different ways without three
   separate network feeds:
    - All Bets: entries from the round currently in progress (mirrors the
      old behaviour of clearing/refilling each round, just derived from
      the log instead of wiping the DOM directly).
    - Previous: entries from the last round that actually finished.
    - Top: the biggest wins across the whole retained log, regardless of
      which round they happened in.
   Reset in enter() below — a fresh mountain shouldn't show another one's
   history. */
let feedLog=[];
let feedTab='all';
function addFeed(n,m,v,win,you){
 feedLog.unshift({name:n,mult:m,value:v,win,you,nonce});
 if(feedLog.length>300)feedLog.length=300;
 renderFeed();
}
function setFeedTab(t){
 feedTab=t;
 for(const k of['all','prev','top'])document.getElementById('ft-'+k).classList.toggle('on',k===t);
 renderFeed();
}
function fiHTML(e){
 const c=e.win?'#10b981':'#ef4444';
 return `<div class="fi">
  <div class="fi-av" style="background:${e.you?M.accent+'2a':'rgba(255,255,255,.05)'};color:${e.you?M.accent:'#64748b'}">${e.name.slice(0,2).toUpperCase()}</div>
  <span class="fi-n" style="${e.you?'color:'+M.accent+';font-weight:700':''}">${e.name}</span>
  <span class="fi-m" style="color:${c}">${e.win?fx(e.mult):'—'}</span>
  <span class="fi-v" style="color:${c}">${e.win?'+'+Math.round(e.value):'−'+Math.round(e.value)}</span>
 </div>`;
}
function renderFeed(){
 let list,empty;
 if(feedTab==='prev'){
  const prevNonce=feedLog.map(e=>e.nonce).find(nn=>nn!==nonce);
  list=prevNonce!=null?feedLog.filter(e=>e.nonce===prevNonce):[];
  empty='No previous round yet';
 } else if(feedTab==='top'){
  list=feedLog.filter(e=>e.win).sort((a,b)=>b.value-a.value).slice(0,20);
  empty='No big wins yet';
 } else {
  list=feedLog.filter(e=>e.nonce===nonce);
  empty='Waiting for the next ascent…';
 }
 const l=document.getElementById('feed-l');
 l.innerHTML=list.length?list.map(fiHTML).join(''):`<div id="feed-e">${empty}</div>`;
 document.getElementById('feed-ct').textContent=list.length+(list.length===1?' bet':' bets');
 const total=list.reduce((s,e)=>s+(e.win?e.value:0),0);
 document.getElementById('feed-total').textContent=total>0?f2(total)+' TKN total win':'';
}
function renderHist(){
 document.getElementById('hist').innerHTML=
  M.hist.map((v,i)=>`<span class="hchip" style="${chipCSS(v)}" onclick="showHistDetail(${i})">${fx(v)}</span>`).join('');
}
/* Shows whether *this* player had a stake on a past round (and what
   happened to it) when they tap one of the history chips — M.histBets is
   kept index-aligned with M.hist, both unshifted together in
   handleRoundEnd, so M.histBets[i] is always "my bets, if any, for the
   round M.hist[i] came from". */
function showHistDetail(i){
 const mult=M.hist[i];
 const hb=(M.histBets&&M.histBets[i])||[null,null];
 document.getElementById('hist-pop-mult').textContent=
  (mult>=M.ceiling?'★ SUMMIT · ':'FELL AT ')+fx(mult);
 const rows=hb.map((b,slot)=>{
  if(!b)return '';
  if(b.state==='cashed')return `<div class="hp-bet"><span>STAKE ${slot+1} · ${f2(b.stake)} TKN</span>`+
   `<b style="color:var(--gn)">TAKEN @ ${fx(b.cashMult)} · +${f2(b.payout)} TKN</b></div>`;
  if(b.state==='lost')return `<div class="hp-bet"><span>STAKE ${slot+1} · ${f2(b.stake)} TKN</span>`+
   `<b style="color:var(--rd)">FELL${b.refund>0?' · +'+f2(b.refund)+' TKN back':''}</b></div>`;
  return '';
 }).filter(Boolean).join('');
 document.getElementById('hist-pop-body').innerHTML=rows||'<div class="hp-empty">You didn\'t play this round.</div>';
 const stripRect=document.getElementById('strip').getBoundingClientRect();
 const pop=document.getElementById('hist-pop');
 pop.style.top=(stripRect.bottom+8)+'px';
 pop.classList.add('on');
}
function closeHistPop(){document.getElementById('hist-pop').classList.remove('on');}
document.addEventListener('click',e=>{
 const pop=document.getElementById('hist-pop');
 if(!pop.classList.contains('on'))return;
 if(pop.contains(e.target)||e.target.classList.contains('hchip'))return;
 closeHistPop();
});
function setStatus(){
 const d=document.getElementById('dot'),s=document.getElementById('strip-t');
 const m={waiting:['#f59e0b','ACCEPTING STAKES'],climbing:['#10b981','ASCENT IN PROGRESS'],
  fallen:['#ef4444','ROUND SETTLED']}[phase]||['#7c90ae','—'];
 d.style.background=m[0];d.style.boxShadow='0 0 7px '+m[0];s.textContent=m[1];
}
function updHUD(){

  <p>Every mountain is generated from its real-world data rather than tuned by hand.</p>

  <p><strong>Return to player</strong> is the share of all money staked that comes back to players across the long run. 97% RTP means £97 returned per £100 staked, averaged over a very large number of rounds. It says nothing about any single round, and it is not a prediction of what you will get.</p>

  <p>Peaks with the lowest base return give the most back on a losing stake — see <strong>Rewards</strong> in this menu for exactly how that works.</p>`},

/* ═══ PROVABLY FAIR — reveal & self-check ═══
   The commitment for a round is shown before it starts. Once that
   round ends, its seed is revealed here and re-hashed live (real
   SHA-256, run in your own browser) so the match is visible, and the
   seed is independently replayed through crashFromSeed to confirm it
   reproduces the exact crash point that was shown — proving both that
   the commitment wasn't swapped and that the result wasn't tampered
   with. The server never reveals a round's seed until after it ends. */
async function renderPFReveal(){
 const box=document.getElementById('pf-prev');
 if(!box)return;
 if(!lastRound){box.style.display='none';return;}
 const checkHash=await sha256Hex(lastRound.seed);
 const checkCrash=M?crashFromSeed(M,lastRound.seed,lastRound.clientSeed,lastRound.n):lastRound.crashAt;
 const ok=checkHash===lastRound.hash&&checkCrash===lastRound.crashAt;
 box.style.display='';
 const okEl=document.getElementById('pf-prev-ok');
 okEl.textContent=ok?'✓ verified':'✕ mismatch';
 okEl.style.color=ok?'var(--gn)':'var(--rd)';
 document.getElementById('pf-prev-body').innerHTML=
  `round ${lastRound.n} · seed <span style="color:#cbd9ee">${lastRound.seed}</span><br>`+
  `sha256(seed) = ${checkHash.slice(0,28)}… — matches the commitment shown before that climb.<br>`+
  `Replaying the seed gives ${fx(checkCrash)} — matches the result shown.`;
}

/* ═══ LIFECYCLE — driven entirely by the shared WebSocket connection.
   Every mountain keeps climbing on the server whether anyone's watching
   or not; this client just renders whatever it's told. ═══ */
function connectWS(){
 const proto=location.protocol==='https:'?'wss':'ws';
 ws=new WebSocket(proto+'://'+location.host+'/ws');
 /* refreshMe() re-syncs balance on every (re)connect, not just at boot —
    a 'balance' push for anything that settled while this socket was
    down (a win, a lossback refund, a jackpot) is sent to the OLD, by-then
    -dead socket and never arrives on the new one. Without this, the
    displayed balance could silently drift below the real one after any
    drop/reconnect — e.g. a laptop sleeping mid-round, or a wifi blip —
    even though the actual balance was always correct server-side. */
 ws.onopen=()=>{ lastWsMsgAt=Date.now(); refreshMe(); for(const m of MTN) wsSend({type:'subscribe',mountainId:m.id}); };
 ws.onclose=()=>{ setTimeout(connectWS,1500); };
 ws.onmessage=e=>{
  lastWsMsgAt=Date.now();
  let msg; try{msg=JSON.parse(e.data);}catch(err){return;}
  onWS(msg);
 };
}
function wsSend(o){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(o)); }

/* A plain WebSocket has no built-in way to notice a half-open connection —
   a laptop sleeping, a wifi switch, or a proxy silently dropping the TCP
   stream can all leave `ws` reporting readyState OPEN forever with no
   onclose ever firing, so connectWS's own reconnect logic never triggers.
   The client is then stuck showing whatever local state it had — most
   visibly, a 'climbing' phase whose local mult prediction keeps running
   with nothing left to ever stop it (see startClimbAnim's own rngCap
   clamp for the resulting worst case). During normal play a `sync`
   arrives every ~150-200ms while climbing and a `phase`/`state` broadcast
   at least every few seconds regardless — so going this long with zero
   messages of any kind is never legitimate, and force-reconnecting is
   always safe (hydrateActive() re-syncs everything from the fresh
   snapshot the resubscribe brings back). */
setInterval(()=>{
 if(Date.now()-lastWsMsgAt>20000){
  lastWsMsgAt=Date.now();
  if(ws){ws.onclose=null;try{ws.close();}catch(e){}}
  connectWS();
 }
},5000);

function onWS(msg){
 switch(msg.type){
  case 'snapshot':{
   const m=MTN.find(x=>x.id===msg.mountainId); if(!m)break;
   m.progress=msg.progress; m.jackpot=msg.jackpot; m.liveCount=msg.subscriberCount;
   m._rs={phase:msg.phase,mult:msg.mult,phaseStartedAt:msg.phaseStartedAt,
    serverSeedHash:msg.serverSeedHash,nonce:msg.nonce,clientSeed:msg.clientSeed,myBets:msg.myBets,summit:msg.summit};
   if(M&&M.id===m.id)hydrateActive();
   break;
  }
  case 'phase':{
   const m=MTN.find(x=>x.id===msg.mountainId); if(!m)break;
   if(msg.progress!==undefined)m.progress=msg.progress;
   if(msg.jackpot!==undefined)m.jackpot=msg.jackpot;
   m._rs.phase=msg.phase; m._rs.phaseStartedAt=msg.ts;
   if(msg.nonce!==undefined)m._rs.nonce=msg.nonce;
   if(msg.serverSeedHash!==undefined)m._rs.serverSeedHash=msg.serverSeedHash;
   if(msg.clientSeed!==undefined)m._rs.clientSeed=msg.clientSeed;
   if(msg.phase==='climbing')m._rs.mult=1;
   if(M&&M.id===m.id)applyPhase(msg);
   break;
  }
  case 'state':{
   const m=MTN.find(x=>x.id===msg.mountainId); if(!m)break;
   m.progress=msg.progress; m.jackpot=msg.jackpot;
   if(M&&M.id===m.id)updJackpotUI();
   break;
  }
  case 'sync':{
   const m=MTN.find(x=>x.id===msg.mountainId); if(!m)break;
   m._rs.mult=msg.mult;
   /* mult only ever climbs during a round — it's never legitimate for the
      displayed number to go down mid-climb. The local rAF loop
      (startClimbAnim) already predicts mult forward every frame with the
      identical growth formula the server uses, so it's normally a hair
      ahead of what a sync reports by the time the message arrives (network
      + processing delay). Snapping — or even blending — toward that
      slightly-behind server value pulled the number backward across a
      just-crossed 2-decimal boundary and back again, which read as the
      readout flickering between two numbers; worse now that a climb takes
      ~a minute and the reader has time to watch each digit. Only ever let
      a sync move the number forward, never back — if the server is ahead
      (client fell behind, e.g. a throttled background tab) this still
      catches it up immediately; if the server is behind, local prediction
      is trusted since it's already within a frame or two of correct. */
   if(M&&M.id===m.id)mult=phase==='climbing'?Math.max(mult,msg.mult):msg.mult;
   break;
  }
  case 'cashoutResult':{
   if(M&&M.id===msg.mountainId){const you=!!(myUser&&msg.name===myUser.username);addFeed(msg.name,msg.mult,msg.value,true,you);}
   break;
  }
  case 'lossResult':{
   if(M&&M.id===msg.mountainId){const you=!!(myUser&&msg.name===myUser.username);addFeed(msg.name,0,msg.stake,false,you);}
   break;
  }
  case 'roundEnd':{
   const m=MTN.find(x=>x.id===msg.mountainId); if(!m)break;
   if(M&&M.id===m.id)handleRoundEnd(msg);
   m.jackpot=msg.jackpot;
   /* m.progress is deliberately NOT applied here. altOf() re-anchors its
      whole climb curve off M.progress (see altOf's comment), so bumping
      it immediately — while this mountain is still sitting on the
      "FELL AT X M" reveal, mult still pinned at crashAt — makes the very
      next frame reinterpret that same crashAt against the NEW, already-
      advanced start point and reproject it further up the slope. The
      climber visibly "blipped" a thousand-plus metres above the altitude
      the reveal text had just shown. The upcoming phase:'waiting'
      broadcast (below, in the 'phase' case) carries this exact same
      progress value and applies it once the fallen pause is actually
      over — that's the only time it's safe to move. */
   /* keep the re-hydration cache in sync too — otherwise leaving and
      re-entering (or reloading) a mountain during the brief post-round
      pause would show it stuck at the old climb's multiplier/altitude
      instead of the freshly-reset state. */
   m._rs.phase='fallen'; m._rs.mult=msg.crashAt; m._rs.phaseStartedAt=msg.ts; m._rs.summit=msg.summit;
   break;
  }
  case 'subscriberCount':{
   const m=MTN.find(x=>x.id===msg.mountainId); if(m)m.liveCount=msg.count;
   break;
  }
  case 'balance':{
   if(msg.balance!==null&&msg.balance!==undefined){balance=msg.balance;updBal();}
   break;
  }
  case 'betAccepted':{
   if(M&&M.id===msg.mountainId&&bets[msg.slot]){bets[msg.slot].state=msg.state;updBet(msg.slot);}
   break;
  }
  case 'betCancelled':{
   if(M&&M.id===msg.mountainId){bets[msg.slot]=null;updBet(msg.slot);}
   break;
  }
  case 'cashOutAccepted':{
   if(M&&M.id===msg.mountainId&&bets[msg.slot]){
    const b=bets[msg.slot];b.state='cashed';b.cashMult=msg.cashMult;b.payout=msg.payout;
    sfxCash();updBet(msg.slot);
    toast('+'+f2(msg.payout)+' TKN at '+fx(msg.cashMult),'w');
   }
   break;
  }
  case 'betSettled':{
   if(M&&M.id===msg.mountainId&&bets[msg.slot]){
    const b=bets[msg.slot];b.state='lost';b.refund=msg.refund;
    updBal();updBet(msg.slot);
    toast(msg.refund>0?'Fell at '+fx(msg.crashAt)+' · '+f2(msg.refund)+' TKN returned':'Fell at '+fx(msg.crashAt),'l');
   }
   break;
  }
  case 'jackpotWin':{
   if(M&&M.id===msg.mountainId)showJkWin(msg);
   break;
  }
  case 'error':{
   toast(msg.message||'Something went wrong','l');
   break;
  }
 }
}

/* Applies a mountain's phase transition to the active view — mirrors the
   original startWait()/beginClimb() DOM updates, just triggered by a
   server message instead of a locally-owned timer. */
function applyPhase(msg){
 if(msg.phase==='waiting'){
  phase='waiting';mult=1;countdown=5;waitEnteredAt=performance.now();
  trail=[];puffs=[];camAlt=altOf(1);camX=faceX(altOf(1));flash=0;shake=0;
  nonce=msg.nonce;serverSeedHash=msg.serverSeedHash;clientSeed=msg.clientSeed;
  document.getElementById('pf-n').textContent=nonce;
  document.getElementById('pf-hash').textContent='commit(sha256) '+(serverSeedHash?serverSeedHash.slice(0,36):'—')+'…';
  renderPFReveal();
  renderFeed();
  const n=document.getElementById('mult-n');
  n.style.color='rgba(255,255,255,.85)';n.textContent=countdown;
  document.getElementById('mult-lab').textContent='NEXT ASCENT IN';
  document.getElementById('mult-sub').textContent='PLACE YOUR STAKE';
  document.getElementById('jkwin').classList.remove('on');
  stopClimbAnim();
  for(let i=0;i<2;i++){
   if(bets[i]&&bets[i].state==='next')bets[i].state='queued';
   else if(bets[i]&&(bets[i].state==='cashed'||bets[i].state==='lost'))bets[i]=null;
   updBet(i);
  }
  setStatus();updHUD();loop();
  if(tickI)clearInterval(tickI);
  tickI=setInterval(()=>{
   if(phase!=='waiting')return;
   countdown=Math.max(0,Math.ceil(5-(performance.now()-waitEnteredAt)/1000));
   n.textContent=countdown;
  },250);
 } else if(msg.phase==='climbing'){
  if(tickI){clearInterval(tickI);tickI=null;}
  phase='climbing';mult=1;lastPulseInt=1;lastMultTxt='';
  document.getElementById('mult-lab').textContent='ALTITUDE MULTIPLIER';
  document.getElementById('mult-n').style.color='#fff';
  document.getElementById('mult-sub').textContent='';
  for(let i=0;i<2;i++){if(bets[i]&&bets[i].state==='queued')bets[i].state='live';updBet(i);}
  setStatus();
  startClimbAnim();
 }
}

/* Re-enters the currently active mountain's already-known state — used
   both when you open a mountain (it may already be mid-round) and right
   after a snapshot arrives for the mountain you're already viewing. */
function hydrateActive(){
 const rs=M._rs;
 nonce=rs.nonce;serverSeedHash=rs.serverSeedHash;clientSeed=rs.clientSeed;
 document.getElementById('pf-n').textContent=nonce;
 document.getElementById('pf-hash').textContent='commit(sha256) '+(serverSeedHash?serverSeedHash.slice(0,36):'—')+'…';
 renderPFReveal();
 bets=(rs.myBets||[null,null]).map(b=>b?{stake:b.stake,
  state:b.state,cashMult:b.cashMult,payout:0,refund:0}:null);
 phase=rs.phase;mult=rs.mult;
 trail=[];camAlt=altOf(mult);camX=faceX(altOf(mult));flash=0;shake=0;
 const n=document.getElementById('mult-n');
 if(phase==='waiting'){
  waitEnteredAt=performance.now()-(Date.now()-rs.phaseStartedAt);
  n.style.color='rgba(255,255,255,.85)';
  document.getElementById('mult-lab').textContent='NEXT ASCENT IN';
  document.getElementById('mult-sub').textContent='PLACE YOUR STAKE';
  if(tickI)clearInterval(tickI);
  tickI=setInterval(()=>{
   if(phase!=='waiting')return;
   countdown=Math.max(0,Math.ceil(5-(performance.now()-waitEnteredAt)/1000));
   n.textContent=countdown;
  },250);
 } else if(phase==='climbing'){
  n.style.color='#fff';n.textContent=fx(mult);
  document.getElementById('mult-lab').textContent='ALTITUDE MULTIPLIER';
  document.getElementById('mult-sub').textContent='';
  startClimbAnim();
 } else {
  roundSummit=!!rs.summit;
  n.textContent=fx(mult);
  document.getElementById('mult-lab').textContent=roundSummit?'★ SUMMIT REACHED':'FELL AT';
  document.getElementById('mult-sub').textContent=roundSummit
   ?M.name.toUpperCase()+' · '+M.elev.toLocaleString()+' M'
   :Math.round(altOf(mult)).toLocaleString()+' M';
 }
 document.getElementById('jkwin').classList.remove('on');
 for(const k of['all','prev','top'])document.getElementById('ft-'+k).classList.toggle('on',k===feedTab);
 renderFeed();
 setStatus();updHUD();
 for(let i=0;i<2;i++)updBet(i);
 loop();
}

/* Pure client-side visual interpolation between the server's periodic
   `sync` messages — grows `mult` with the same formula the server uses
   so the number climbs smoothly at 60fps, but never decides on its own
   when the round ends. Only a `roundEnd` message (via applyPhase's
   'fallen'-equivalent handling in handleRoundEnd) stops a climb. */
function startClimbAnim(){
 stopClimbAnim();
 let last=performance.now();
 function step(now){
  if(phase!=='climbing'){climbRaf=null;return;}
  const dt=Math.min((now-last)/1000,.1);last=now;
  /* frac used to clamp at 1 once mult passed M.ceiling, capping the
     growth-rate multiplier at a flat 5.2x forever after — any round that
     climbed past ceiling settled into an unchanging pace no matter how
     much further it had left, which is what read as boring/too-slow near
     the top. Only clamping the lower bound lets mult keep genuinely
     accelerating past ceiling instead of plateauing.
     Deliberately no separate speedup term tied to how little of the
     mountain is left — mult grows at exactly the same rate every round,
     regardless of community progress, so nothing about a climb's pace
     changes just because it's close to (or far from) the summit. Must
     match the server's identical growth formula in round.js's stepMult
     exactly, or the client's predicted mult drifts from the server's
     authoritative one between syncs. */
  const frac=Math.max(Math.log(mult)/Math.log(M.ceiling),0);
  mult*=Math.exp(M.growth*(1+4.2*Math.pow(frac,1.35))*dt);
  /* This is local, unauthoritative prediction only — the server alone
     decides when a round actually ends, and if its roundEnd/sync messages
     ever stop arriving for a stretch (a dropped message, a long tab
     freeze, a reconnect gap) this loop has nothing else telling it to
     stop. The (1+4.2*frac^1.35) term above is deliberately explosive once
     frac climbs past ~1 — that's what makes a rare high-multiplier round
     still feel like it's accelerating instead of crawling — but left
     completely unchecked that same explosiveness reaches actual
     Infinity in under two minutes of real time (measured), which is
     exactly the "multiplier just says Infinity and the climb never
     ends" bug: a real desync, made catastrophically visible by this
     formula's own runaway shape. No real round can ever legitimately
     need mult above rngCap — the server's crashFromSeed hard-clamps
     every draw there — so clamping the local guess to it is always
     safe: it can never show a number the server couldn't have produced,
     and it guarantees this loop can never again render nonsense while
     it waits for the next real message to correct it. */
  if(mult>M.rngCap)mult=M.rngCap;
  const al=altOf(mult);
  if(trail.length===0||al-trail[trail.length-1]>5){trail.push(al);if(trail.length>150)trail.shift();}
  const mn=document.getElementById('mult-n');
  const txt=fx(mult);
  /* At the current (deliberately slowed) growth rate the 2-decimal value
     only actually changes a few times a second, which is below the ~10Hz
     a human eye needs to read discrete updates as continuous motion — so
     even though the number itself is accurate and jitter-free, snapping
     the text straight to each new value reads as a stutter rather than a
     climb. A quick, subtle glide on every real tick (not the bigger
     'pulse' below, which is reserved for whole-number milestones) turns
     that into a steady climbing rhythm without showing any more digits. */
  if(txt!==lastMultTxt){
   lastMultTxt=txt;
   mn.textContent=txt;
   mn.classList.remove('tick');void mn.offsetWidth;mn.classList.add('tick');
   // the readout itself heats up as the climb gets riskier — white,
   // through amber, into danger-red approaching ceiling — the same
   // "temperature" cue the climb curve uses.
   const riskT=clamp(frac,0,1);
   mn.style.color=riskT<0.6?mix('#ffffff','#fbbf24',riskT/0.6):mix('#fbbf24','#ef4444',(riskT-0.6)/0.4);
  }
  const wholeNow=Math.floor(mult);
  if(wholeNow>lastPulseInt){
   lastPulseInt=wholeNow;
   mn.classList.remove('pulse');void mn.offsetWidth;mn.classList.add('pulse');
  }
  updHUD();
  updJackpotUI();
  for(let i=0;i<2;i++)updBetLive(i);
  climbRaf=requestAnimationFrame(step);
 }
 climbRaf=requestAnimationFrame(step);
}
function stopClimbAnim(){ if(climbRaf){cancelAnimationFrame(climbRaf);climbRaf=null;} }

/* Counts a number up from 0 to its final value instead of just printing
   it — the number climbing fast is a big part of what makes a slot-style
   win land as a hit rather than a receipt. */
function countUp(el,target,duration){
 if(reduceMotion){el.textContent='+'+f2(target)+' TKN';return;}
 const start=performance.now();
 function step(now){
  const p=clamp((now-start)/duration,0,1);
  const eased=1-Math.pow(1-p,3);
  el.textContent='+'+f2(target*eased)+' TKN';
  if(p<1)requestAnimationFrame(step);
 }
 requestAnimationFrame(step);
}

/* The one moment the round pauses on purpose to make sure the player
   actually sees what just happened — a jackpot summit is rare enough
   that a toast fading out in three seconds isn't enough. Only shown
   to players who actually staked that round; if you weren't in it,
   there's no personal outcome to report, so it stays hidden. */
function showJkWin(outcome){
 const el=document.getElementById('jkwin');
 if(!outcome.participated){el.classList.remove('on');return;}
 const win=outcome.won>0;
 el.classList.remove('on');void el.offsetWidth;   // restart the pop-in animation every time
 el.classList.toggle('lose',!win);
 document.getElementById('jkwin-ic').textContent=win?'🏆':'🏔️';
 document.getElementById('jkwin-ttl').textContent=win?'JACKPOT!':'SUMMIT CONQUERED';
 const amtEl=document.getElementById('jkwin-amt');
 if(win){amtEl.style.display='';countUp(amtEl,outcome.won,900);}
 else{amtEl.style.display='none';amtEl.textContent='';}
 document.getElementById('jkwin-sub').textContent=win
  ?'from the summit pool'
  :'You staked this round, but the jackpot pool was empty';
 el.classList.add('on');
}

/* Mirrors the original endRound() DOM/animation work, driven by the
   server's `roundEnd` reveal instead of a locally-decided crash check.
   `M.progress` is intentionally applied by the caller (onWS) AFTER this
   runs, since the "FELL AT / SUMMIT" text below needs the OLD progress
   value (via altOf, which reads M.progress) to reproduce exactly what
   was shown live during the climb. */
function handleRoundEnd(msg){
 stopClimbAnim();
 crashAt=msg.crashAt;
 /* the camera/canvas position (draw() reads the global `mult`, via
    altOf(mult)) must snap to the true final crashAt here — otherwise it
    stays wherever the last periodic 'sync' left it, up to ~180ms of
    fast exponential growth behind the real stopping point, while the
    "FELL AT X M" text below (which reads crashAt directly) is already
    correct. That mismatch is what made the mountain's altitude ruler
    look far short of the number actually shown. */
 mult=crashAt;
 const summit=msg.summit;
 lastRound={n:msg.nonce,seed:msg.serverSeed,hash:msg.serverSeedHash,clientSeed:msg.clientSeed,crashAt:msg.crashAt};
 renderPFReveal();
 /* Snapshot *my* bet outcomes for this round before applyPhase's next
    'waiting' transition clears bets[] for the upcoming round — kept
    index-aligned with M.hist via the same unshift/pop, so a clicked
    chip can always look its own bet slots back up later. */
 if(!M.histBets)M.histBets=new Array(M.hist.length).fill(null);
 M.histBets.unshift(bets.map(b=>b?{stake:b.stake,state:b.state,cashMult:b.cashMult,payout:b.payout,refund:b.refund}:null));
 if(M.histBets.length>24)M.histBets.pop();
 M.hist.unshift(rnd(crashAt));if(M.hist.length>24)M.hist.pop();
 renderHist();

 if(summit){
  /* A round can be granted a summit before crashAt's own altitude would
     naturally reach the true peak — see the server's isSummit() "summit
     push" easier-finish condition. Cut straight to the reveal at whatever
     crashAt actually is: no artificial tween racing the number or the
     climber the rest of the way up first. mult is already crashAt (set
     above), and that's exactly what's paid out — the multiplier climbs at
     the same rate as any other round and the summit pays whatever it
     genuinely reached, nothing more. */
  beginSummitReveal();
  return;
 }

 phase='fallen';roundSummit=false;fallTS=performance.now();ropeCaught=false;
 hitStopUntil=reduceMotion?0:performance.now()+90;
 const n=document.getElementById('mult-n');
 n.textContent=fx(crashAt);
 n.style.color='#ef4444';
 document.getElementById('mult-lab').textContent='FELL AT';
 document.getElementById('mult-sub').textContent=Math.round(altOf(crashAt)).toLocaleString()+' M';
 flashColor='#ef4444';
 shake=reduceMotion?0:18;flash=reduceMotion?0:1;
 sfxCrash();
 setStatus();loop();
}
/* Cuts over to the zoomed-out summit reveal — called once the close-up
   "final push" tween above (or immediately, under reduced motion) has
   genuinely brought the climber to M.elev. */
function beginSummitReveal(){
 phase='fallen';roundSummit=true;fallTS=performance.now();
 /* drawSummitReveal() renders the climber through the same drawClimber()
    used for the normal close-up view, which also draws whatever's left
    in puffs[] — any breath/ice puff spawned during the climb (or the
    final-push tween) that hadn't finished fading yet carries its old
    close-up screen coordinates straight into the reveal's completely
    different zoomed-out composition, where they mean nothing. Read as a
    random floating blob stuck to the mountain, unrelated to the climber
    or the confetti. Nothing here should survive the cut. */
 puffs=[];
 const n=document.getElementById('mult-n');
 n.textContent=fx(crashAt);
 n.style.color=M.accent;
 document.getElementById('mult-lab').textContent='★ SUMMIT REACHED';
 document.getElementById('mult-sub').textContent=M.name.toUpperCase()+' · '+M.elev.toLocaleString()+' M';
 /* a summit is the big moment, not the crash — it should hit harder,
    not softer. Gold flash instead of the danger-red one falls get. */
 flashColor='#fbbf24';
 shake=reduceMotion?0:16;flash=reduceMotion?0:0.85;
 spawnConfetti();
 sfxSummit();
 setStatus();loop();
}

function loop(){
 if(raf)return;
 const f=ts=>{draw(ts);raf=requestAnimationFrame(f);};
 raf=requestAnimationFrame(f);
}

/* ═══ ACCOUNT ═══
   No login/signup screens — the server hands every visitor a silent guest
   identity (cookie-backed session, auto-created on first /api/me call) so
   there's always a `myUser` by the time this resolves. See
   backend/src/auth/session.js's resolveOrCreateSession. */
function setAcctUI(){
 if(myUser){
  const av=document.getElementById('avatar');
  av.title='@'+myUser.username; av.setAttribute('aria-label','@'+myUser.username);
  document.getElementById('acctdd-user').textContent='@'+myUser.username;
  balance=myUser.balance; updBal();
 }
}
async function refreshMe(){
 try{
  const res=await fetch('/api/me',{credentials:'same-origin'});
  if(res.ok)myUser=await res.json();
 }catch(e){}
 setAcctUI();
}

renderSelect();
/* the guest cookie is only guaranteed to exist once /api/me has actually
   round-tripped — opening the WebSocket before that landed would connect
   anonymously (no userId), and betting would silently fail with
   'auth_required' until the next reconnect. Await it first so the very
   first connection already carries the session cookie. */
(async()=>{ await refreshMe(); connectWS(); })();
</script>
</body>
