<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Mountaineer — Crash Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Futura PT';src:local('Futura PT Demi'),local('FuturaPT-Demi'),local('Futura PT');font-weight:600;}
</style>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#101a2e;--panel:#1a2540;--panel2:#1f2c4a;--panel3:#26355a;
  --bd:rgba(160,190,235,.22);--bd2:rgba(160,190,235,.12);
  --tx:#f2f7ff;--mu:#bccce4;--dim:#93a8c8;
  --gn:#34d399;--rd:#f87171;--am:#fbbf24;--bl:#60a5fa;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Futura PT','Futura','Century Gothic',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:600;background:var(--bg);color:var(--tx);
display:flex;flex-direction:column;height:100vh;height:100dvh;user-select:none;font-size:13px;
padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(160,190,235,.24);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(160,190,235,.4)}
:focus-visible{outline:2px solid #7dd3fc;outline-offset:2px}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
  transition-duration:.001ms !important;scroll-behavior:auto !important}
 .act.cash{animation:none}
 .mc:hover{transform:none}
 #mult-n.pulse{animation:none}
}

#hdr{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:56px;
padding-top:env(safe-area-inset-top);flex-shrink:0;border-bottom:1px solid var(--bd);background:#16203a}
.lg{display:flex;align-items:center;gap:10px;cursor:pointer}
.lg:hover .lg-n{color:var(--gn)}
.lg:hover .lg-m{color:#fff}
.lg-m{color:var(--gn);font-size:19px}
.lg-n{font-family:'Futura PT','Futura','Century Gothic',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:800;font-size:18px;letter-spacing:.09em;color:#fff}
.lg-t{font-size:10px;color:var(--dim);letter-spacing:.18em}
#hdr-r{display:flex;align-items:center;gap:15px}
.hstat{display:flex;align-items:baseline;gap:6px}
.hstat-l{font-size:11px;color:var(--mu)}
.hstat-v{font-size:16px;font-weight:700;color:#fff}
.hdiv{width:1px;height:20px;background:var(--bd)}
.btn-s{padding:7px 13px;font-size:11px;font-family:inherit;letter-spacing:.08em;font-weight:500;
background:rgba(160,190,235,.10);border:1px solid var(--bd);border-radius:6px;color:var(--mu);
cursor:pointer;transition:.15s}
.btn-s:hover{background:rgba(160,190,235,.2);color:#fff;border-color:rgba(160,190,235,.4)}


#select{flex:1;overflow-y:auto;padding:28px 24px 48px}
#sel-h{max-width:700px;margin-bottom:26px}
#sel-t{font-family:'Futura PT','Futura','Century Gothic',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:800;font-size:38px;line-height:1.1;color:#fff;margin-bottom:11px}
#sel-t em{font-style:normal;color:var(--gn)}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:1250px){#grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){#grid{grid-template-columns:1fr}}

.mc{border:1px solid var(--bd);border-radius:14px;background:var(--panel2);overflow:hidden;
cursor:pointer;transition:transform .22s,border-color .22s,box-shadow .22s}
.mc:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.mc-vis{position:relative;height:128px;overflow:hidden}
.mc-vis canvas{position:absolute;inset:0;width:100%;height:100%}
.mc-tag{position:absolute;top:10px;right:10px;padding:3px 10px;border-radius:20px;font-size:10px;
font-weight:700;letter-spacing:.09em;z-index:3}
.mc-alt{position:absolute;bottom:8px;left:12px;z-index:3;font-family:'Futura PT','Futura','Century Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
font-weight:800;font-size:17px;color:rgba(255,255,255,.82);text-shadow:0 2px 10px #000}
.mc-live{position:absolute;bottom:8px;right:12px;z-index:3;font-size:10.5px;font-weight:700;
color:#d1fae5;background:rgba(6,20,14,.55);padding:3px 9px;border-radius:20px;
border:1px solid rgba(52,211,153,.35)}
/* ══ JACKPOT METER — shared "casino machine" look for both the lobby
   card's jackpot box and the in-game side panel's, so the same feature
   reads consistently in both places. A dark lit-up housing, a big
   gold-gradient glowing digit readout for the amount (not the plain
   flat colour it used to be), and an unmissable alarm state — pulsing
   glow + a blinking label — the moment a mountain enters its summit
   push, rather than the previous barely-there background tint. */
.mc-jk,#jackpot{position:relative;background:linear-gradient(160deg,rgba(126,74,10,.34),rgba(38,18,4,.55));
border:1px solid rgba(251,191,36,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.mc-jk{padding:10px 12px;margin-bottom:12px;border-radius:10px}
.jkbox-lab{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:800;
letter-spacing:.1em;color:#fbbf24}
.jkbox-amt{font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:.01em;
line-height:1;margin-top:7px;display:flex;align-items:baseline;gap:5px;
background:linear-gradient(180deg,#fff8dd 0%,#fbbf24 55%,#f59e0b 100%);
-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
text-shadow:0 0 22px rgba(251,191,36,.5)}
.jkbox-amt .cur{font-family:inherit;font-size:.46em;font-weight:700;letter-spacing:.07em;
-webkit-text-fill-color:#fbbf24;opacity:.8}
.mc-jk .jkbox-amt{font-size:25px}
.mc-jk-sub{font-size:9.5px;color:rgba(255,255,255,.62);margin-top:7px;letter-spacing:.03em}
.mc-jk.push,#jackpot.push{border-color:rgba(251,146,60,.8);animation:jkPulse 1.1s ease-in-out infinite}
.mc-jk.push .jkbox-lab,#jackpot.push .jkbox-lab{color:#fb923c;animation:jkBlink 1s steps(2,start) infinite}
@keyframes jkPulse{
 0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 0 rgba(251,146,60,0)}
 50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 22px rgba(251,146,60,.55)}
}
@keyframes jkBlink{0%,100%{opacity:1}50%{opacity:.42}}
.mc-b{padding:14px 16px 16px}
.mc-n{font-family:'Futura PT','Futura','Century Gothic',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:800;font-size:22px;color:#fff;line-height:1}
.mc-r{font-size:11px;color:var(--bl);margin:4px 0 9px}
.mc-cl{font-size:11.5px;color:var(--mu);line-height:1.65;margin-bottom:12px;min-height:76px}
.mc-off{border-top:1px solid var(--bd2);border-bottom:1px solid var(--bd2);padding:10px 0;margin-bottom:12px}
.off-r{display:flex;justify-content:space-between;align-items:center;padding:3px 0;gap:8px}
.off-l{font-size:10.5px;color:var(--dim);letter-spacing:.05em}
.off-v{font-size:12px;font-weight:700;text-align:right}
.mc-st{display:grid;grid-template-columns:1fr;margin-bottom:12px;gap:6px}
.ms-l{font-size:9.5px;color:var(--dim);letter-spacing:.1em;margin-bottom:4px}
.ms-v{font-size:15px;font-weight:700;color:#fff}
.mc-hist{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.hchip{padding:2px 7px;border-radius:4px;font-size:10.5px;font-weight:700}
.mc-go{width:100%;padding:12px 0;font-family:inherit;font-size:12px;font-weight:700;
letter-spacing:.09em;border:none;border-radius:8px;cursor:pointer;transition:.16s}
.mc-go:hover{filter:brightness(1.2)}

#game{flex:1;display:none;min-height:0}
#game.on{display:flex}
#stage{flex:1;position:relative;overflow:hidden;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;z-index:5;pointer-events:none}
#hud-tl{top:46px;left:16px}
#hud-mtn{font-family:'Futura PT','Futura','Century Gothic',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:800;font-size:19px;color:#fff;text-shadow:0 2px 12px #000}
#hud-rw{font-size:11.5px;margin-top:5px;text-shadow:0 1px 8px #000;letter-spacing:.04em;font-weight:600}
#hud-tr{top:46px;right:16px;text-align:right}
#hud-alt-lab{font-size:9.5px;letter-spacing:.14em;color:rgba(255,255,255,.6);
font-weight:600;text-shadow:0 1px 8px #000}
#hud-alt{font-size:14px;font-weight:700;color:#fff;text-shadow:0 1px 10px #000;margin-top:2px}
#hud-zone{font-size:11px;margin-top:5px;letter-spacing:.1em;font-weight:700;text-shadow:0 1px 8px #000}
#hud-push{font-size:11px;margin-top:5px;letter-spacing:.1em;font-weight:700;color:#fb923c;
text-shadow:0 1px 8px #000;display:none}
#hud-push.on{display:block;animation:hudPushPulse 1.6s ease-in-out infinite}
@keyframes hudPushPulse{0%,100%{opacity:1}50%{opacity:.5}}
#mult-box{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);text-align:center;
z-index:6;pointer-events:none}
#mult-lab{font-size:11px;letter-spacing:.22em;margin-bottom:9px;min-height:15px;color:rgba(255,255,255,.72);font-weight:500}
#mult-n{font-family:'Futura PT','Futura','Century Gothic',-apple-system,BlinkMacSystemFont,sans-serif;font-weight:800;font-size:112px;line-height:1;
text-shadow:0 4px 34px rgba(0,0,0,.95);letter-spacing:-.02em;display:inline-block;will-change:transform}
@keyframes multPulse{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
#mult-n.pulse{animation:multPulse .38s cubic-bezier(.22,1,.36,1)}
@keyframes multTick{0%{transform:translateY(3px);opacity:.72}100%{transform:translateY(0);opacity:1}}
#mult-n.tick{animation:multTick .14s ease-out}
#mult-sub{font-size:11.5px;margin-top:10px;letter-spacing:.13em;min-height:15px;color:rgba(255,255,255,.75)}
/* mobile-only stand-in for #mult-box — see the max-width:900px rule
   below for why this exists instead of just repositioning #mult-box. */
#mult-bar{display:none}
#jkwin{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.3);
z-index:9;text-align:center;pointer-events:none;opacity:0;
background:rgba(8,14,26,.86);border:1px solid rgba(251,191,36,.55);border-radius:20px;
padding:26px 48px;box-shadow:0 20px 70px rgba(0,0,0,.6);white-space:nowrap}
#jkwin.on{opacity:1;animation:jkPopIn .65s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes jkPopIn{
 0%{transform:translate(-50%,-50%) scale(.3);opacity:0}
 55%{transform:translate(-50%,-50%) scale(1.16);opacity:1}
 78%{transform:translate(-50%,-50%) scale(.93)}
 100%{transform:translate(-50%,-50%) scale(1);opacity:1}
}
#jkwin-glow{position:absolute;inset:-70px;border-radius:50%;z-index:-1;
background:radial-gradient(circle,rgba(251,191,36,.5),rgba(251,191,36,0) 68%);
animation:jkGlow 1.5s ease-in-out infinite}
@keyframes jkGlow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.95;transform:scale(1.14)}}
#jkwin-ic{font-size:54px;line-height:1;margin-bottom:8px;
filter:drop-shadow(0 6px 20px rgba(251,191,36,.65))}
#jkwin-ttl{font-family:'Futura PT','Futura','Century Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
font-weight:800;font-size:36px;color:#fbbf24;letter-spacing:.05em;
text-shadow:0 0 26px rgba(251,191,36,.75),0 4px 20px rgba(0,0,0,.6)}
#jkwin-amt{font-family:'Futura PT','Futura','Century Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
font-weight:800;font-size:44px;color:#fff;margin-top:8px;letter-spacing:-.01em;
text-shadow:0 4px 22px rgba(0,0,0,.7)}
#jkwin-sub{font-size:13.5px;color:rgba(255,255,255,.85);margin-top:10px;letter-spacing:.04em}
#jkwin.lose #jkwin-ttl{color:#c2d1e8;text-shadow:0 4px 20px rgba(0,0,0,.6)}
#jkwin.lose #jkwin-glow{background:radial-gradient(circle,rgba(160,190,235,.32),rgba(160,190,235,0) 68%)}
#strip{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;
padding:12px 18px;background:linear-gradient(180deg,rgba(6,10,20,.96),rgba(6,10,20,.5) 60%,transparent)}
#dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
#strip-t{font-size:12px;letter-spacing:.13em;color:rgba(255,255,255,.9);font-weight:600}
/* Was overflow:hidden (silently cropping whichever chips didn't fit) —
   now a real horizontal scroller so every stored round is reachable, not
   just however many happened to fit the strip's width. Chips get
   flex-shrink:0 below so scrolling kicks in instead of squeezing them
   unreadably small. */
#hist{display:flex;gap:5px;margin-left:auto;overflow-x:auto;overflow-y:hidden;
-webkit-overflow-scrolling:touch;scrollbar-width:none;max-width:100%}
#hist::-webkit-scrollbar{display:none}
#hist .hchip{flex-shrink:0;cursor:pointer;transition:.12s}
#hist .hchip:hover,#hist .hchip:active{filter:brightness(1.3)}
/* ══ HIST DETAIL POPOVER — "did I have a stake on this round?" ══ */
#hist-pop{position:fixed;z-index:120;left:50%;transform:translateX(-50%);
background:#16203a;border:1px solid var(--bd);border-radius:12px;padding:12px 14px;
min-width:200px;max-width:calc(100vw - 32px);box-shadow:0 16px 44px rgba(0,0,0,.55);display:none}
#hist-pop.on{display:block}
#hist-pop-hd{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:8px}
#hist-pop-mult{font-family:'Futura PT','Futura','Century Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
font-weight:800;font-size:15px;color:#fff}
#hist-pop-x{background:none;border:none;color:var(--mu);cursor:pointer;font-size:13px;padding:2px 4px;line-height:1}
#hist-pop-x:hover{color:#fff}
.hp-bet{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
padding:6px 0;font-size:12px;color:var(--mu);border-top:1px solid var(--bd2)}
.hp-bet:first-child{border-top:none}
.hp-bet b{font-weight:700}
.hp-empty{font-size:12px;color:var(--dim);padding:2px 0}
/* overflow-y:auto (not hidden) because the two stake panels plus
   jackpot/RTP/feed/provably-fair together can genuinely be taller than
   the viewport on a shorter desktop screen (a laptop, a smaller display)
   — with the old overflow:hidden that just clipped the bottom of the
   panel with no way to reach it, not just on mobile. #feed no longer
   tries to be its own independently-scrolling flex:1 region for the same
   reason: one scroll container for the whole panel is simpler and
   guarantees everything is reachable regardless of viewport height. */
#side{width:368px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--bd);
display:flex;flex-direction:column;overflow-y:auto}
.sec-h{padding:11px 18px 10px;font-size:11px;color:var(--dim);letter-spacing:.15em;
border-bottom:1px solid var(--bd2);flex-shrink:0;display:flex;justify-content:space-between;
background:rgba(160,190,235,.04)}
#jackpot{padding:14px 18px;border-bottom:1px solid var(--bd2);flex-shrink:0}
#jackpot .jkbox-amt{font-size:28px}
.jk-sub{font-size:10.5px;color:rgba(255,255,255,.62);margin-top:7px}
#rew{padding:12px 18px;border-bottom:1px solid var(--bd2);flex-shrink:0;
display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;transition:.15s}
#rew:hover{background:rgba(160,190,235,.07)}
.rw-k{font-size:11px;color:var(--dim);letter-spacing:.1em;margin-bottom:4px}
.rw-n{font-size:17px;font-weight:700;font-family:'Futura PT','Futura','Century Gothic',-apple-system,BlinkMacSystemFont,sans-serif}
.bet{padding:15px 18px;border-bottom:1px solid var(--bd2)}
.bet-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bet-t{font-size:11px;color:var(--mu);letter-spacing:.11em;font-weight:500}
.bet-st{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--dim)}
.row{display:flex;gap:9px;margin-bottom:9px}
.fld{flex:1}
.fld-l{font-size:10.5px;color:var(--dim);letter-spacing:.09em;margin-bottom:5px}
input[type=number]{width:100%;background:rgba(10,16,30,.55);border:1px solid rgba(160,190,235,.28);
border-radius:8px;padding:12px 12px;color:#fff;font-size:22px;font-family:'Futura PT','Futura','Century Gothic',-apple-system,BlinkMacSystemFont,sans-serif;outline:none;
transition:border-color .18s,background .18s;-moz-appearance:textfield;font-weight:700;text-align:center}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
input::placeholder{color:#6f84a4;font-size:20px}
input:focus{border-color:#7dd3fc;background:rgba(10,16,30,.75)}
.qk{display:flex;gap:5px;margin-bottom:10px}
.qk button{flex:1;padding:8px 0;font-size:12px;font-family:inherit;background:rgba(160,190,235,.10);
border:1px solid rgba(160,190,235,.2);border-radius:6px;color:var(--mu);cursor:pointer;transition:.14s;font-weight:700}
.qk button:hover{background:rgba(160,190,235,.26);color:#fff}
.auto-row{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.chk{width:19px;height:19px;border-radius:5px;border:1px solid rgba(160,190,235,.35);
background:rgba(10,16,30,.4);cursor:pointer;flex-shrink:0;display:flex;align-items:center;
justify-content:center;font-size:13px;color:var(--gn)}
.chk.on{background:rgba(52,211,153,.25);border-color:rgba(52,211,153,.65)}
.chk-l{font-size:11.5px;color:var(--mu);cursor:pointer}
.act{width:100%;padding:19px 0;border:none;border-radius:10px;font-family:'Futura PT','Futura','Century Gothic',-apple-system,BlinkMacSystemFont,sans-serif;font-size:17px;
font-weight:800;letter-spacing:.05em;cursor:pointer;transition:.16s}
.act.place{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;box-shadow:0 4px 20px rgba(59,130,246,.45)}
.act.place:hover{transform:translateY(-1px);filter:brightness(1.1)}
.act.next{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff}
.act.queued{background:rgba(96,165,250,.18);border:1px solid rgba(96,165,250,.5);color:#93c5fd}
.act.cash{background:linear-gradient(135deg,#10b981,#059669);color:#fff;animation:pg 1.25s ease-in-out infinite;
font-size:19px;padding:22px 0}
.act.done{background:rgba(52,211,153,.16);border:1px solid rgba(52,211,153,.45);color:#6ee7b7;cursor:default}
.act.dead{background:rgba(248,113,113,.14);border:1px solid rgba(248,113,113,.4);color:#fca5a5;cursor:default}
@keyframes pg{0%,100%{box-shadow:0 4px 20px rgba(16,185,129,.45)}50%{box-shadow:0 4px 40px rgba(16,185,129,.8)}}
#feed{flex:none;display:flex;flex-direction:column;min-height:0}
#feed-l{overflow-y:visible}
.fi{display:flex;align-items:center;gap:8px;padding:7px 16px;
border-bottom:1px solid rgba(160,190,235,.07);animation:sl .26s ease}
@keyframes sl{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.fi-av{width:23px;height:23px;border-radius:50%;display:flex;align-items:center;
justify-content:center;font-size:9.5px;font-weight:700;flex-shrink:0}
.fi-n{font-size:12px;color:#cbd9ee;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi-tag{font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;letter-spacing:.06em;flex-shrink:0}
.fi-m{font-size:11.5px;font-weight:700;min-width:44px;text-align:right}
.fi-v{font-size:11.5px;font-weight:700;min-width:54px;text-align:right}
#feed-e{padding:24px 16px;text-align:center;font-size:11px;color:#7c90ae}
#pf{padding:10px 16px;border-top:1px solid var(--bd2);flex-shrink:0;font-size:10px;color:var(--dim);line-height:1.7}
#pf-hash{word-break:break-all;color:#7c90ae}
#pf-prev{margin-top:8px;padding-top:8px;border-top:1px solid var(--bd2)}
#pf-prev-hd{font-weight:700;letter-spacing:.08em;color:var(--dim);font-size:10px}
#pf-prev-hd span{margin-left:4px;font-weight:700}
#pf-prev-body{word-break:break-all;color:#7c90ae;margin-top:4px;line-height:1.6}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(8px);
padding:13px 24px;border-radius:10px;font-size:14px;font-weight:700;z-index:999;opacity:0;
transition:.26s;pointer-events:none;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast.w{background:#10b981;color:#04231a}
#toast.l{background:#f87171;color:#2c0707}

/* ══ RESPONSIVE — mobile-first pass. Two real bugs this fixes beyond
   sizing: (1) #stage's old min-height:42vh plus #side's old
   max-height:50vh could together exceed the viewport once the header
   wraps to 2-3 rows, and with body{overflow:hidden} that clipped the bet
   panel with no way to scroll to it. (2) #hud-tl (mountain name) and
   #mult-box (the big multiplier) genuinely overlapped on phone-width
   stages — confirmed by measuring both boxes' rects at 375px wide. ══ */
@media(max-width:900px){
 #game.on{flex-direction:column}
 /* #mult-box is centered on the canvas at a fixed top:X% — on desktop
    that sits safely above where the climber renders, but the climber's
    own screen position is ALSO pinned to a fixed fraction of the stage
    (CY()=H*0.62 in the draw loop). On a short mobile stage those two
    fixed points end up close enough together that the multiplier landed
    right on top of the climber sprite, with the canvas-drawn zone/summit
    labels adding to the mess right in the same spot. No percentage-based
    reshuffling fixes this reliably (verified while trying) — it's two
    independently-positioned things sharing too little vertical room. So
    on mobile the multiplier moves out of the canvas overlay entirely
    into #mult-bar, a normal-flow bar above the stage — the canvas is
    then free to just show the mountain and climber, uncluttered, and
    there's no fixed point left for anything to collide with. */
 #mult-box{display:none}
 #mult-bar{display:flex;align-items:baseline;justify-content:center;gap:11px;
  padding:8px 16px;background:#0c1424;border-bottom:1px solid var(--bd);flex:0 0 auto}
 #mult-bar-lab{font-size:9.5px;letter-spacing:.14em;color:rgba(255,255,255,.55);
  text-transform:uppercase;font-weight:600}
 #mult-bar-n{font-family:'Futura PT','Futura','Century Gothic',-apple-system,BlinkMacSystemFont,sans-serif;
  font-weight:800;font-size:clamp(26px,8vw,36px);color:#fff;line-height:1}
 #stage{flex:0 0 auto;height:44dvh;min-height:240px}
 /* #side already scrolls (see the base rule) — here it just needs to
    exactly fill whatever's left below #stage instead of its fixed
    desktop width, so the game view above stays put while the bet
    panel/feed scroll, rather than the whole page scrolling. */
 #side{flex:1;min-height:0;width:100%;border-left:none;border-top:1px solid var(--bd)}
}
@media(max-width:640px){
 /* Buttons/header made smaller on request — they were eating too much of
    the screen on a real phone (3 wrapped rows before any of the actual
    mountain was visible). Shrunk padding/font on every header control
    below, and gave the reclaimed height straight to #stage rather than
    letting it default back to the bet panel. */
 /* Header is kept to one line on mobile (was previously allowed to wrap
    onto 2-3 rows, eating a big chunk of the screen before any mountain
    was visible) — nowrap everywhere below plus shrinking each control
    lets it all fit in the strip's own height instead. */
 #hdr{flex-wrap:nowrap;height:auto;padding:7px 8px;gap:4px}
 #hdr-r{flex-wrap:nowrap;gap:4px;flex-shrink:1;min-width:0;justify-content:flex-end}
 .lg{gap:6px;min-width:0;flex-shrink:1}
 .lg-n{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .lg-m{font-size:15px;flex-shrink:0}
 /* #acctstat (BALANCE/TOP UP/avatar) no longer wraps either — everything
    inside it shrinks instead so the whole header stays one row. */
 #acctstat{flex-wrap:nowrap;gap:5px;flex-shrink:0}
 .hstat{gap:3px}
 .hstat-l{font-size:9px}
 .hstat-v{font-size:13px}
 .btn-s{padding:6px 8px;font-size:10px;white-space:nowrap}
 #menubtn{padding:6px 9px}
 #avatar{width:26px;height:26px}
 .hdiv{height:16px}
 #sel-t{font-size:clamp(22px,7vw,28px)}
 .mc-n{font-size:19px}
 #stage{height:40dvh;min-height:220px}
 #mult-bar-n{font-size:clamp(24px,9vw,32px)}
 #hud-mtn{font-size:14px}
 #hud-alt-lab{font-size:8.5px}
 /* the compacted mobile #strip is shorter than desktop's, so the shared
    top:48px offset (tuned against the taller desktop strip) left a
    bigger gap here than intended — pull it in to match. */
 #hud-tl{max-width:60%;top:33px}
 #hud-tr{max-width:36%;top:33px}
 #hud-rw{display:none}
 #strip{padding:8px 12px;gap:5px}
 #hist{min-width:0}
 #menu-wrap{flex-direction:column}
 #menu-nav{width:100%;border-right:none;border-bottom:1px solid var(--bd);
  display:flex;overflow-x:auto;padding:12px;gap:6px}
 .mn{white-space:nowrap;margin-bottom:0;flex-shrink:0}
 #menu-body{padding:20px 18px 40px}
 #vip-body{padding:20px 16px 40px}
 #ladder{height:320px}
 #toast{max-width:calc(100vw - 32px);white-space:normal;text-align:center}
 /* Placing a stake meant scrolling well past the mountain view first —
    #side's own content (jackpot box, RTP row, two full stake panels) ran
    to ~930px on a 390-wide phone against ~340px of actually-visible
    height, all of it still using desktop's roomy padding. None of that
    padding was load-bearing on a phone — it exists to keep the desktop
    sidebar from feeling cramped next to a much taller stage. Tightened
    every block here so STAKE 1's own "PLACE STAKE" button lands inside
    the first screenful instead of a scroll below it. */
 #jackpot{padding:7px 14px}
 #jackpot .jkbox-amt{font-size:21px}
 .jk-sub{margin-top:3px}
 #rew{padding:6px 14px}
 .rw-k{margin-bottom:2px}
 .bet{padding:8px 14px}
 .bet-hd{margin-bottom:5px}
 .row{margin-bottom:5px}
 .fld-l{margin-bottom:2px}
 input[type=number]{padding:8px 10px;font-size:18px}
 input::placeholder{font-size:16px}
 .qk{margin-bottom:5px}
 .qk button{padding:9px 0}
 .auto-row{margin-bottom:4px}
 .act{padding:13px 0;font-size:15px}
 .act.cash{padding:15px 0;font-size:16px}
}
/* Below ~480px the header row (logo + mute + menu + balance + top up +
   avatar) no longer fits on one line even at the max-width:640px sizes
   above. The wordmark stays (the .lg-n rule in the 640px block above
   already ellipsizes it rather than wrapping/overflowing if it's ever
   the tightest fit), but the BALANCE/TKN labels trim down to just the
   number, which is the space that actually matters for keeping the row
   on one line. */
@media(max-width:480px){
 .lg-n{font-size:12px;letter-spacing:.05em}
 .hstat-l{display:none}
 .hstat{gap:0}
 .btn-s{padding:6px 7px;font-size:9px}
}
@media(max-width:420px){
 #mult-bar-n{font-size:clamp(22px,10vw,28px)}
 #jkwin{padding:18px 26px}
 #jkwin-ttl{font-size:26px}
 #jkwin-amt{font-size:32px}
 /* below ~380px "ASCENT IN PROGRESS" (the longest strip status string)
    used to not fit next to the history chips on one line — it wrapped to
    3 lines and, since #strip/#hud-tl/#hud-tr are all independently
    absolutely-positioned, that extra unaccounted-for height just
    overlapped everything below it. #strip-t staying nowrap (below) is
    what actually fixes that; shrinking the chips instead of dropping
    them keeps the previous-round history visible, with #hist's own
    overflow:hidden quietly clipping whichever tail chips don't fit
    rather than wrapping or pushing anything else around. */
 #hist{gap:3px}
 .hchip{padding:2px 5px;font-size:9px}
 #strip-t{white-space:nowrap}
 #hud-tl{max-width:68%}
 #hud-tr{max-width:34%}
 #hud-zone,#hud-push{font-size:10px}
}
/* Touch input, any screen size (a touch-capable laptop/tablet included) —
   bump anything meant to be tapped up to a comfortable target size. */
@media(pointer:coarse){
 .chk{width:25px;height:25px}
 .qk button{padding:11px 0}
 .mdi{padding:13px 12px}
 .btn-s{padding:9px 14px}
}
/* header buttons are deliberately smaller than the general touch-target
   bump above once the header itself has wrapped onto its own compact
   rows — real phones are always pointer:coarse, so without this the rule
   just above would win the cascade (same specificity, declared later) and
   silently re-inflate .btn-s back past what the max-width:640px block
   asked for. */
@media(max-width:640px) and (pointer:coarse){
 .btn-s{padding:6px 8px}
 #menubtn{padding:6px 9px}
 /* same reason as .btn-s/#menubtn above — the generic touch bump
    (.qk button padding:11px, .chk 25x25) was winning the cascade here
    too and quietly re-inflating the stake panel back past what the
    max-width:640px block just trimmed it down to. */
 .qk button{padding:7px 0}
 .chk{width:20px;height:20px}
}

/* ═══ Per-mountain live state — the server runs one authoritative round
   loop per mountain regardless of who's watching, and pushes updates over
   a single shared WebSocket. `progress`/`jackpot`/`liveCount` are kept
   fresh on every MTN entry for the lobby cards; `_rs` caches that
   mountain's current round-lifecycle fields (phase/mult/seeds/nonce/my
   bets) so switching into a mountain that's mid-round hydrates instantly
   from already-received data instead of waiting on a fresh message. ═══ */
MTN.forEach(m=>{
 m.progress=0;m.jackpot=0;m.liveCount=0;
 m._rs={phase:'waiting',mult:1,phaseStartedAt:Date.now(),serverSeedHash:null,nonce:0,clientSeed:null,myBets:[null,null],summit:false};
});

const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

function xmur3(s){let h=1779033703^s.length;
 for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
 return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0;};}

/* Pure function of (seed, clientSeed, nonce) — kept client-side ONLY to
   independently replay a round the server has already revealed, proving
   the crash point it produced rather than just trusting it. The server
   runs the authoritative copy of this same function; `seed` here is never
   known to the client until after the round it belongs to has ended. */
function crashFromSeed(m,seed,cSeed,n){
 const f=xmur3(seed+':'+cSeed+':'+n); f();
 const r=f()/4294967296;
 if(r<m.p0)return 1.00;
 const u=(r-m.p0)/(1-m.p0);
 const c=Math.pow(1-u,-1/m.alpha);
 if(c>=m.rngCap)return rnd(m.rngCap);
 return Math.max(1.00,rnd(c));
}
async function sha256Hex(str){
 const buf=new TextEncoder().encode(str);
 const digest=await crypto.subtle.digest('SHA-256',buf);
 return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

/* ═══ RTP — derived, not hand-authored ═══
   With alpha=1 fixed on every peak, base RTP is exactly
   (1-p0) regardless of what multiplier a player targets —
   no calibration point, no strategy-dependence. rake and
   lossback are both only ever paid out on a losing bet (see
   Room.cashOut/endRound server-side), so neither is a
   guaranteed, outcome-independent boost — folding either into
   one flat "effective RTP" number would overstate what a
   winning bet actually gets, so both are shown to players as
   their own separate, clearly loss-conditional lines instead.
   Recomputes automatically from p0, so it can never drift out
   of sync if that's retuned. */
function baseRTPof(m){return (1-m.p0)*100;}
function baseEffRTP(m){return baseRTPof(m);}

/* ═══ FACE GEOMETRY — side-on profile ═══ */
function profileT(m,t){
 const p=m.profile;
 t=clamp(t,0,1);
 for(let i=0;i<p.length-1;i++){
  const t0=p[i][0],t1=p[i+1][0];
  if(t<=t1||i===p.length-2){
   const lt=t1>t0?clamp((t-t0)/(t1-t0),0,1):0;
   return lerp(p[i][1],p[i+1][1],ease(lt));
  }
 }
 return p[p.length-1][1];
}
function buildFace(m){
 const STEP=4, rows=[];
 let x=0;
 for(let a=m.base;a<=m.elev+140;a+=STEP){
  const t=clamp((a-m.base)/(m.elev-m.base),0,1);
  let pt=profileT(m,t);
  /* true 0m is the trailhead, not a wall — flatten into it regardless
     of what that mountain's own profile calls for at t=0. The true
     summit gets the opposite treatment: a steep, dramatic final push
     rather than the profile's usual shape, so the climb visibly
     culminates instead of just trailing off. Kept inside the existing
     single-boundary face model on purpose — a fully two-sided peak
     silhouette was tried earlier and caused real rock/sky topology
     bugs, and was reverted for it. */
  if(t<0.04)pt=lerp(1,pt,t/0.04);
  else if(t>0.96)pt=lerp(pt,0.1,(t-0.96)/0.04);
  x+=lerp(0.07,0.88,pt)*STEP;
  rows.push(x);
 }
 faceTable={base:m.base,elev:m.elev,step:STEP,rows};
}
function faceX(alt){
 const T=faceTable;
 const i=(alt-T.base)/T.step;
 let base;
 if(i<=0) base=T.rows[0]+i*(T.rows[1]-T.rows[0]);
 else if(i>=T.rows.length-1) base=T.rows[T.rows.length-1];
 else { const i0=Math.floor(i); base=lerp(T.rows[i0],T.rows[i0+1],i-i0); }
 /* the micro-ripple that gives every other stretch of the face its jagged
    rock texture would otherwise still make the flattened trailhead (see
    buildFace's t<0.04 zone) look uneven — fade it in over that same zone
    so a fresh climb genuinely starts on flat ground, not just gently
    sloped ground with a wobbly outline. */
 const t=clamp((alt-T.base)/(T.elev-T.base),0,1);
 const flatFade=t<0.04?t/0.04:1;
 const j=(Math.sin(alt*0.055)*3.2+Math.sin(alt*0.021+1.7)*5.5+Math.sin(alt*0.13+3.1)*1.4)*flatFade;
 return base+j;
}
function slopeAngle(alt){
 const d=6;
 return Math.atan2(faceX(alt+d)-faceX(alt-d), d*2);
}
/* Visual climb-position curve: lt^CLIMB_P is what keeps the summit
   approach feeling snappy — lowered from 0.6 to 0.5 since even 0.6 still
   left a bit too much distance to close out in the last stretch (e.g.
   6.1% of the climb still remaining at 90% of the way there, now 5.1%).
   That same exponent has an infinite slope at
   lt=0, which made the climber rocket up the lower slopes the instant a
   round started. CLIMB_K covers the low end with a quintic ramp that
   starts flat (zero velocity AND zero acceleration at lt=0) and joins
   the lt^CLIMB_P curve at lt=CLIMB_K matching value, velocity, AND
   acceleration (C2-continuous) — matching value+velocity alone (a cubic
   Hermite) still left a jump in acceleration right at the join — nearly
   every round crosses it, since it sits at a low, commonly-reached
   multiplier — which read as a visible jerk/stutter rather than a smooth
   climb.
   CLIMB_K itself lowered from 0.25 to 0.17: at 0.25 the ramp didn't
   rejoin the (faster) main curve until ~2.6-3.1x depending on the
   mountain's ceiling, meaning the whole 1.00x-2.00x range players
   actually spend most rounds in was still inside the deliberately-slow
   ease-in — e.g. only 12.9% of the climb was done by 1.50x. At 0.17 the
   ramp rejoins right around 1.9-2.1x on every mountain instead, so
   1.00x-2.00x is now visibly faster (23.0% done by 1.50x) while lt=0
   still has the same zero-velocity, no-teleport start.
   lt^CLIMB_P is a SQRT-SHAPED curve (P<1): steep early, then its own
   slope (d/dlt = P·lt^(P-1)) keeps shrinking all the way to lt=1 — by
   design, to make the early climb feel snappy, but it means the closer a
   round got to a mountain's true ceiling, the SLOWER the climber moved,
   continuously, for the entire back half of the climb (confirmed by
   simulating the real growth formula: on Kilimanjaro the on-screen speed
   fell from a ~220 m/s peak to under 80 m/s and only partially recovered
   by the time it reached the top — a real, sustained crawl, not just a
   last-few-metres thing, and exactly what read as "painfully slow at the
   very top"). CLIMB_MID caps that decay: above lt=CLIMB_MID the curve
   switches to a straight line back up to (1,1), so from there to the
   true summit the climber's speed can only ever hold steady or
   accelerate (dlt/dt itself keeps accelerating the whole climb, per the
   growth formula) — never decelerate — no matter how far above CLIMB_MID
   a round's crash point lands. The line's slope is fixed by requiring it
   pass through both (CLIMB_MID, CLIMB_MID^CLIMB_P) and (1,CLIMB_TREF)
   exactly, not by matching the incoming curve's slope at CLIMB_MID —
   matching both would overshoot past the target before lt=1 (the tangent
   to a concave curve always runs above it). That leaves a single one-off
   slope drop right at CLIMB_MID, then a strictly non-decreasing climb
   from there on — a world better than the multi-second continuous decay
   it replaces, and CLIMB_MID=0.4 sits well past the 1.00x-2.00x range so
   none of that earlier fix is touched (still exactly 23.0%/41.2% done at
   1.50x/2.00x on every mountain).
   CLIMB_TREF — there is deliberately no hard cap on the multiplier any
   more (see crashFromSeed's m.rngCap, ~1000x a mountain's `ceiling`
   instead of clamping the draw AT `ceiling`) — a big win shouldn't get
   silently truncated down to `ceiling` just because it drew higher. But
   climbEase still has to stay inside [0,1]: lt=1 (mult=ceiling) no longer
   maps to the true summit (1.0) — it maps to CLIMB_TREF=0.95, leaving a
   5% reserve above lt=1 for `ceiling`-beating draws to climb into instead
   of hard-freezing at the peak.
   That reserve's own shape went through two attempts. First was a single
   exponential decay from (1,CLIMB_TREF) toward 1 as lt→∞, matching the
   incoming line's slope at lt=1 so there was no kink at all there. It
   looked right in every check at the time — smooth, monotonic, still
   visibly climbing at 100x/300x/1000x above `ceiling` — but a full
   real-time simulation out to a mountain's actual rngCap told a different
   story: an exponential decay is, unavoidably, still an exponential decay
   — d(alt)/dlt shrinks faster than dlt/dt (which keeps accelerating, per
   the growth formula) can ever catch up, so past some point the climber's
   on-screen speed doesn't just slow down, it converges to exactly zero.
   On Kilimanjaro that meant sitting completely motionless, pixel for
   pixel, for 12+ real seconds while the number climbed from ~1,500x into
   the tens of thousands — a full freeze, just delayed rather than
   removed, and after lowering alpha (see crashFromSeed) draws that deep
   into the tail are meaningfully more reachable than they used to be.
   The reserve is now two straight lines instead: (CLIMB_MID,CLIMB_MID_V)
   to (1,CLIMB_TREF), then a second, shallower line from there to
   (CLIMB_TAIL_LT_END,1) — CLIMB_TAIL_LT_END=2.8 comfortably covers every
   mountain's own rngCap (they land between lt≈2.54-2.78). A straight
   line's slope never decays, so speed in that second stretch settles to
   a constant floor (driven by dlt/dt, which is still accelerating) and
   never reaches zero, all the way out to the true maximum multiplier —
   slower than the rest of the climb, genuinely, but a steady walk, not a
   stop. The trade is a single one-off kink in speed right at `ceiling`
   (same trade already made once at CLIMB_MID, just larger here), which
   only the ~3% of rounds that ever cross `ceiling` will ever see. */
const CLIMB_P=0.5, CLIMB_K=0.17, CLIMB_MID=0.4, CLIMB_TREF=0.95, CLIMB_TAIL_LT_END=2.8;
const CLIMB_A=Math.pow(CLIMB_K,CLIMB_P);                                        // value at the join
const CLIMB_B=CLIMB_K*CLIMB_P*Math.pow(CLIMB_K,CLIMB_P-1);                      // d(t)/d(s) at the join
const CLIMB_C=CLIMB_K*CLIMB_K*CLIMB_P*(CLIMB_P-1)*Math.pow(CLIMB_K,CLIMB_P-2);  // d2(t)/d(s)2 at the join
// quintic f(s)=a3 s^3+a4 s^4+a5 s^5 (s=lt/CLIMB_K) is the unique curve with
// f(0)=f'(0)=f''(0)=0 and f(1)=A, f'(1)=B, f''(1)=C
const CLIMB_A3=10*CLIMB_A-4*CLIMB_B+0.5*CLIMB_C;
const CLIMB_A4=-15*CLIMB_A+7*CLIMB_B-CLIMB_C;
const CLIMB_A5=6*CLIMB_A-3*CLIMB_B+0.5*CLIMB_C;
const CLIMB_MID_V=Math.pow(CLIMB_MID,CLIMB_P);                    // value of lt^CLIMB_P at CLIMB_MID
const CLIMB_LINE_M=(CLIMB_TREF-CLIMB_MID_V)/(1-CLIMB_MID);        // slope of the closing line, (CLIMB_MID,CLIMB_MID_V) -> (1,CLIMB_TREF)
const CLIMB_LINE_B=CLIMB_MID_V-CLIMB_LINE_M*CLIMB_MID;
const CLIMB_TAIL_M=(1-CLIMB_TREF)/(CLIMB_TAIL_LT_END-1);          // slope of the reserve line, (1,CLIMB_TREF) -> (CLIMB_TAIL_LT_END,1)
const CLIMB_TAIL_B=CLIMB_TREF-CLIMB_TAIL_M;
function climbEase(lt){
 if(lt<=0)return 0;
 if(lt<CLIMB_K){
  const s=lt/CLIMB_K;
  return s*s*s*(CLIMB_A3+s*(CLIMB_A4+s*CLIMB_A5));
 }
 if(lt<CLIMB_MID)return Math.pow(lt,CLIMB_P);
 if(lt<1)return CLIMB_LINE_M*lt+CLIMB_LINE_B;
 if(lt<CLIMB_TAIL_LT_END)return CLIMB_TAIL_M*lt+CLIMB_TAIL_B;
 return 1;
}
/* Inverse of climbEase — given an altitude fraction, finds the lt (and so
   the mult) that produces it. climbEase has no clean closed form once the
   ramp is folded in, but it's monotonic over its whole domain, so plain
   bisection is exact enough (2^-40) with negligible cost. Used by the
   final-push tween (see draw()'s finalPush block) to drive the climber at
   a constant on-screen speed: that tween needs "what mult puts him at
   this altitude", the opposite direction from every other use of
   climbEase/altOf in the file. */
function climbEaseInv(t){
 t=clamp(t,0,1);
 if(t<=0)return 0;
 let lo=0,hi=CLIMB_TAIL_LT_END;
 for(let i=0;i<48;i++){
  const mid=(lo+hi)/2;
  if(climbEase(mid)<t)lo=mid;else hi=mid;
 }
 return (lo+hi)/2;
}
function altOf(m){
 if(!M)return 0;
 const lt=Math.max(Math.log(Math.max(m,1))/Math.log(M.ceiling),0);
 const t=climbEase(lt);
 /* the visual climb starts wherever the long-term community climber
    last fell, not back at base camp — mult itself is untouched (still
    1.00× to crashAt, same fair Pareto draw), only the on-screen
    altitude this maps to is re-anchored to the current progress point.
    mult=ceiling no longer lands exactly on the true summit (see
    CLIMB_TREF) — only mult=∞ does, in the limit; genuinely reaching the
    summit is instead a discrete event the game explicitly grants (see
    isSummit() server-side, and beginSummitReveal() here), not something
    altOf() itself can produce for any finite, real multiplier. */
 const startAlt=M.base+(M.progress||0);
 return startAlt+(M.elev-startAlt)*t;
}
function zoneAt(a){let z=null;for(const q of M.zones)if(a>=q[0])z=q;return z;}

/* Fraction of the way up the mountain the long-term community climb
   has reached — pure metres of accumulated progress, nothing to do
   with any single round's crash multiplier. */
function jackpotFrac(m){
 return clamp((m.progress||0)/(m.elev-m.base),0,1);
}
/* The final stretch to the summit — closest to the top, still carries
   real risk, so it's flagged on the card as its own named zone. */
const SUMMIT_PUSH_FRAC=0.95;
function inSummitPush(m){return jackpotFrac(m)>=SUMMIT_PUSH_FRAC&&jackpotFrac(m)<1;}

/* ═══ THUMBNAILS ═══ */
function thumb(m,cn){
 const c=cn.getContext('2d');
 const w=cn.width=cn.clientWidth*2, h=cn.height=cn.clientHeight*2;
 const g=c.createLinearGradient(0,0,0,h);
 g.addColorStop(0,m.skyHi);g.addColorStop(1,m.skyLo);
 c.fillStyle=g;c.fillRect(0,0,w,h);
 const f=xmur3(m.id);
 for(let i=0;i<38;i++){
  const x=(f()%1000)/1000*w,y=(f()%1000)/1000*h*.7,r=(f()%10)/10*1.5+.4;
  c.globalAlpha=(f()%100)/100*.5+.1;c.fillStyle='#fff';
  c.beginPath();c.arc(x,y,r,0,7);c.fill();
 }
 c.globalAlpha=1;
 const sdL=xmur3(m.id+'sL'), sdR=xmur3(m.id+'sR'), af=xmur3(m.id+'apex');
 const apexF=0.40+(af()%1000)/1000*0.2;
 const apexX=w*apexF, apexY=h*.07, baseY=h*.97;
 const baseL=-w*.06, baseR=w*1.06;
 const N=44, run=[0]; let acc=0;
 for(let i=1;i<=N;i++){acc+=lerp(0.003,0.030,profileT(m,i/N));run.push(acc);}
 const total=run[N];
 c.beginPath();c.moveTo(baseL,baseY);
 for(let i=0;i<=N;i++){
  const t=i/N, frac=run[i]/total;
  const x=baseL+frac*(apexX-baseL), y=baseY-t*(baseY-apexY);
  const jag=((sdL()%1000)/1000-.5)*.02*w*(1-t*.6);
  c.lineTo(x+jag,y);
 }
 for(let i=N-1;i>=0;i--){
  const t=i/N, frac=run[i]/total;
  const x=baseR-frac*(baseR-apexX), y=baseY-t*(baseY-apexY);
  const jag=((sdR()%1000)/1000-.5)*.02*w*(1-t*.6);
  c.lineTo(x+jag,y);
 }
 c.lineTo(baseR,baseY);c.closePath();
 c.fillStyle=m.rock;c.fill();
 c.strokeStyle=m.accent;c.globalAlpha=.6;c.lineWidth=2.5;c.stroke();c.globalAlpha=1;

 /* the mini climber — everyone's shared marker for how far the long-term
    community climb has actually gotten up this mountain. The Y position
    is clamped a little short of the true 0%/100% extremes so it never
    renders exactly at the base or apex, directly behind the altitude/
    live-count labels overlaid on those corners. The X position is
    separately clamped into the visible canvas — the mountain's OUTLINE
    deliberately bleeds off both edges of the frame near its base
    (baseL/baseR sit outside 0..w), which is fine for the silhouette
    itself but would carry the marker off-canvas and make it invisible
    for anyone low on the mountain, i.e. almost always. Low progress
    specifically lands near the BOTTOM-LEFT corner (the marker always
    tracks the left slope), which is exactly where the "X,XXX m" label
    sits — those two clamps alone weren't enough headroom to clear it,
    so anyone early in a climb had their marker rendering behind the
    text. Nudged clear of that corner specifically, rather than raising
    the floor for every low-progress mountain (which would make early
    climbs look further along than they really are). */
 const dotFrac=clamp(jackpotFrac(m),0.035,0.965);
 const pt=dotFrac*N, i0=Math.floor(pt), i1=Math.min(N,i0+1), lt2=pt-i0;
 const dFrac=lerp(run[i0],run[i1],lt2)/total;
 const dx=clamp(baseL+dFrac*(apexX-baseL),w*0.04,w*0.96);
 let dy=baseY-dotFrac*(baseY-apexY);
 if(dy>h*0.78&&dx<w*0.26)dy=h*0.78;
 c.save();c.translate(dx,dy);
 c.strokeStyle='#fff';c.lineWidth=1.1;c.lineCap='round';
 c.beginPath();c.moveTo(-2.2,7);c.lineTo(0,2.2);c.lineTo(2.2,7);c.stroke();
 c.beginPath();c.moveTo(0,1);c.lineTo(-3,-2.5);c.stroke();
 c.beginPath();c.moveTo(0,1);c.lineTo(3,-2.5);c.stroke();
 c.fillStyle='#ef4444';c.beginPath();c.arc(0,-3.6,3.4,0,7);c.fill();
 c.strokeStyle='#fff';c.lineWidth=1.2;c.stroke();
 c.restore();
}

 document.querySelectorAll('[data-thumb]').forEach(c=>thumb(MTN.find(x=>x.id===c.dataset.thumb),c));
 document.querySelectorAll('.mc').forEach(c=>c.onclick=()=>enter(c.dataset.id));

 liveI=setInterval(()=>{

   if(m)el.textContent='🧗 '+(m.liveCount||0)+' climbing now';
  });

 M=MTN.find(x=>x.id===id);
 lastRound=null;

 buildFace(M);

function stopAll(){
 if(raf){cancelAnimationFrame(raf);raf=null;}
 stopClimbAnim();
 if(tickI){clearInterval(tickI);tickI=null;}
 finalPush=null;
}
function resize(){
 const s=document.getElementById('stage');
 if(!s.clientWidth)return;
 DPR=Math.min(window.devicePixelRatio||1,2);
 W=s.clientWidth;H=s.clientHeight;
 cv.width=W*DPR;cv.height=H*DPR;
 cv.style.width=W+'px';cv.style.height=H+'px';
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize);

/* ═══ RENDER ═══ */
const PPM=()=>H/210;
const CY =()=>H*0.62;
const CXS=()=>W*0.40;

function draw(ts){
 if(!M)return;
 if(finalPush){
  /* only the climber's on-screen position (via mult -> altOf) animates
     here — the readout stays fixed on the true crashAt the whole time
     (set in handleRoundEnd/beginSummitReveal) rather than visibly racing
     up toward M.ceiling and then correcting back down to the real payout
     multiplier once the reveal cuts in, which would just trade one
     "wait, that's not what I actually won" moment for another. */
  /* the WS handler applies the round's new (often reset-to-0) progress
     to M.progress synchronously, right after handleRoundEnd() kicks this
     tween off — altOf() anchors off M.progress, so without re-pinning it
     back to what was actually climbed on every frame here, the climber
     would jump to start the final stretch from the WRONG base altitude
     the instant that message lands, not just at the end. */
  M.progress=finalPush.oldProgress;
  const DUR=650;
  const p=clamp((ts-finalPush.start)/DUR,0,1);
  /* Driving this tween through mult (the old `lerp(from,ceiling,eased)`)
     ran it straight through climbEase's compressive curve — the same
     curve that deliberately makes each unit of mult buy LESS altitude the
     closer it gets to the ceiling, so the ordinary climb keeps feeling
     snappy. Fine for a round that's still actually climbing, but here it
     meant a round granted a summit while still well below the peak (see
     the isSummit() "summit push" comment below) would rocket through
     ~99% of its remaining distance in the tween's first ~20ms and then
     visibly crawl the last few metres for the rest of the 650ms — exactly
     the "takes longer near the top" complaint, since the climber really
     was moving far slower there than anywhere else on the mountain.
     Interpolating the ALTITUDE linearly instead — then solving backwards
     for whatever mult produces it — keeps his on-screen speed constant
     for the whole tween, no different from any other stretch of the
     climb. */
  const startAlt=M.base+finalPush.oldProgress;
  const targetAlt=lerp(finalPush.fromAlt,M.elev,p);
  const tFrac=M.elev>startAlt?clamp((targetAlt-startAlt)/(M.elev-startAlt),0,1):1;
  mult=Math.pow(M.ceiling,climbEaseInv(tFrac));
  updHUD();
  if(p>=1){
   M.progress=finalPush.newProgress;
   finalPush=null;
   beginSummitReveal();
  }
 }
 if(phase==='fallen'&&roundSummit){drawSummitReveal(ts);return;}
 const a=M.accent, ppm=PPM(), cy=CY(), cxs=CXS();
 const alt=altOf(mult);
 if(finalPush){
  /* the final-push tween above is already a deliberately-eased animation
     — running it through the normal per-frame camera lerp on top would
     be a second, independent layer of smoothing that can't guarantee it
     keeps up, especially during the tween's fast opening burst. If the
     camera falls behind there, the climber (drawn at the true tweened
     alt, not the lagging camera's) shoots toward or past the top edge of
     the screen in the instant right before the cut to the reveal — the
     "looks broken at the summit" this was meant to fix, just moved a few
     hundred ms later. Track it exactly instead. */
  camAlt=alt;camX=faceX(alt);
 } else {
  camAlt=lerp(camAlt,alt,0.22);
  camX  =lerp(camX,faceX(alt),0.22);
 }
 const t=clamp((camAlt-M.base)/(M.elev-M.base),0,1);
 const wx=w=>cxs+(faceX(w)-camX);
 const wy=w=>cy-(w-camAlt)*ppm;

 ctx.save();
 if(shake>0.1){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88;}

 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,mix(M.skyHi,'#000000',t*.40));
 g.addColorStop(.55,mix(M.skyLo,M.skyHi,t*.8));
 g.addColorStop(1,mix(M.skyLo,'#000000',t*.14));
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 const sf=xmur3(M.id+'st');
 for(let i=0;i<80;i++){
  const x=(sf()%10000)/10000*W,y=(sf()%10000)/10000*H*.72,r=(sf()%10)/10*1.3+.3;
  ctx.globalAlpha=clamp(t*1.2-.05,0,.9)*((sf()%100)/150+.25);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
 }
 ctx.globalAlpha=1;

 ctx.fillStyle='rgba(255,255,255,.07)';
 ctx.beginPath();ctx.moveTo(0,H);
 const df=xmur3(M.id+'d');
 for(let x=0;x<=W;x+=26)
  ctx.lineTo(x,H*.66-Math.abs(Math.sin(x*.005+1.4))*H*.19-((df()%100)/100)*16+t*H*.34);
 ctx.lineTo(W,H);ctx.closePath();ctx.fill();

 /* ── THE FACE ──
    Near the true summit the wall doesn't just keep going — it tapers
    the rock's far (left) edge inward to meet the boundary exactly at
    M.elev, so once the camera actually reaches the top there's simply
    no more rock above it, just sky, the way a real peak ends rather
    than continuing as an infinite cliff. This only touches the left
    edge's position, never the boundary curve itself, so it can't
    reintroduce the topology bugs the panning face model had before —
    the boundary stays exactly as monotonic as it's always been. */
 const topAlt=camAlt+cy/ppm+50, botAlt=camAlt-(H-cy)/ppm-50;
 const facePts=[];let minFX=-60;
 for(let al=topAlt;al>=botAlt;al-=4){
  const x=wx(al),y=wy(al);facePts.push([x,y,al]);if(x<minFX)minFX=x;
 }
 const leftAnchor=minFX-40;
 const peakTaperStart=M.elev-180;
 ctx.beginPath();
 ctx.moveTo(leftAnchor,H+60);
 for(let i=facePts.length-1;i>=0;i--){
  const[x,y,al]=facePts[i];
  let lx=leftAnchor;
  if(al>=M.elev)lx=x;
  else if(al>=peakTaperStart)lx=lerp(leftAnchor,x,ease(clamp((al-peakTaperStart)/(M.elev-peakTaperStart),0,1)));
  ctx.lineTo(lx,y);
 }
 for(const p of facePts)ctx.lineTo(p[0],p[1]);
 ctx.lineTo(leftAnchor,H+60);ctx.closePath();
 ctx.fillStyle=M.rock;ctx.fill();

 ctx.beginPath();
 let mainStarted=false;
 for(const[x,y,al]of facePts){
  if(al>M.elev)continue;   // never draw the boundary line above the true summit
  mainStarted?ctx.lineTo(x,y):ctx.moveTo(x,y);mainStarted=true;
 }
 if(mainStarted){
  ctx.strokeStyle=a;ctx.globalAlpha=.75;ctx.lineWidth=2;ctx.stroke();
  ctx.globalAlpha=.16;ctx.lineWidth=10;ctx.stroke();ctx.globalAlpha=1;
 }
 if(topAlt>=peakTaperStart){
  ctx.beginPath();
  let started=false;
  for(let i=facePts.length-1;i>=0;i--){
   const[x,y,al]=facePts[i];
   if(al<peakTaperStart||al>M.elev)continue;   // this edge stops at the true summit too
   const lx=lerp(leftAnchor,x,ease(clamp((al-peakTaperStart)/(M.elev-peakTaperStart),0,1)));
   started?ctx.lineTo(lx,y):ctx.moveTo(lx,y);started=true;
  }
  ctx.strokeStyle=a;ctx.globalAlpha=.75;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;
 }

 ctx.globalAlpha=.13;ctx.fillStyle=M.snowC;
 for(let al=Math.floor(botAlt/25)*25;al<topAlt;al+=25){
  if(al>=peakTaperStart)continue;
  const y=wy(al),x=wx(al);
  ctx.fillRect(x-190,y,190,2.6);
 }
 ctx.globalAlpha=1;

 ctx.strokeStyle='rgba(255,255,255,.10)';ctx.lineWidth=1;
 for(let al=Math.floor(botAlt/60)*60;al<topAlt;al+=60){
  if(al>=peakTaperStart)continue;
  const y=wy(al),x=wx(al);
  ctx.beginPath();ctx.moveTo(x-170,y+20);ctx.lineTo(x,y);ctx.stroke();
 }

 /* Ruler ticks every 10m (was 100m) — with no hard multiplier cap any
    more, the climb can spend a long stretch of a round compressed into a
    tiny sliver of altitude near/above a mountain's `ceiling` (see
    CLIMB_TREF). 100m ticks would show nothing moving at all through that
    whole stretch; 10m ticks still visibly advance, so there's always a
    felt sense of "still climbing" even while the number keeps racing up
    far faster than the ruler does. Labelling every one of those, though,
    put 20+ overlapping "5,xxx m" strings on screen at once — unreadable.
    So: a short unlabelled mark every 10m for the felt motion, a full
    labelled tick only every 50m for something actually legible. */
 ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1;
 for(let al=Math.ceil(botAlt/10)*10;al<topAlt;al+=10){
  if(al>M.elev||al%50===0)continue;   // the %50 marks get the full labelled tick below
  const y=wy(al),x=wx(al);
  ctx.beginPath();ctx.moveTo(x+13,y);ctx.lineTo(x+24,y);ctx.stroke();
 }
 ctx.font='600 11px "JetBrains Mono",monospace';
 for(let al=Math.ceil(botAlt/50)*50;al<topAlt;al+=50){
  if(al>M.elev)continue;   // no ruler ticks above the true summit — nothing there to mark
  const y=wy(al),x=wx(al);
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x+5,y);ctx.lineTo(x+30,y);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.78)';ctx.fillText(Math.round(al).toLocaleString()+' m',x+36,y+4);
 }

 for(const z of M.zones){
  const y=wy(z[0]);if(y<-40||y>H+40)continue;
  const x=wx(z[0]);
  ctx.strokeStyle=z[2];ctx.globalAlpha=.8;ctx.lineWidth=1.6;ctx.setLineDash([6,5]);
  ctx.beginPath();ctx.moveTo(x-180,y);ctx.lineTo(x+140,y);ctx.stroke();ctx.setLineDash([]);
  ctx.globalAlpha=1;ctx.fillStyle=z[2];ctx.font='700 11px "JetBrains Mono",monospace';
  ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=6;
  ctx.fillText(z[1],x+10,y-6);ctx.shadowBlur=0;
 }

 /* rope trail — takes the camp colour from Base Camp up */
 if(trail.length>1){
  const tc=a;
  ctx.beginPath();
  for(let i=0;i<trail.length;i++){
   const x=wx(trail[i])+15,y=wy(trail[i]);
   i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.strokeStyle=phase==='fallen'?'rgba(239,68,68,.55)':tc;
  ctx.globalAlpha=.6;ctx.lineWidth=1.5;ctx.stroke();
  ctx.globalAlpha=.13;ctx.lineWidth=7;ctx.stroke();ctx.globalAlpha=1;
 }

 if(M.elev-camAlt<cy/ppm){
  const sy=wy(M.elev),sx=wx(M.elev);
  ctx.strokeStyle=a;ctx.globalAlpha=.85;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx,sy-17);ctx.stroke();
  ctx.fillStyle=a;ctx.beginPath();
  ctx.moveTo(sx,sy-17);ctx.lineTo(sx+12,sy-13.5);ctx.lineTo(sx,sy-10);ctx.closePath();ctx.fill();
  ctx.fillStyle=a;ctx.font='700 11px "JetBrains Mono",monospace';
  ctx.shadowColor='rgba(0,0,0,.9)';ctx.shadowBlur=6;
  ctx.fillText('SUMMIT '+M.ceiling.toFixed(0)+'×',sx+17,sy-12);ctx.shadowBlur=0;ctx.globalAlpha=1;
 }

 drawClimber(wx(alt),wy(alt),alt,ts,t);

 const vg=ctx.createRadialGradient(W/2,H*.5,H*.2,W/2,H*.5,H*.86);
 vg.addColorStop(0,'rgba(0,0,0,0)');
 vg.addColorStop(1,`rgba(0,0,0,${.14+t*.20})`);
 ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);

 if(alt>7000&&phase==='climbing'&&!reduceMotion){
  const p=(alt-7000)/(M.elev-7000);
  ctx.globalAlpha=.06*p*(.5+Math.sin(ts*.004)*.5);
  ctx.fillStyle='#ef4444';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
 }
 if(flash>.01){ctx.globalAlpha=flash*.5;ctx.fillStyle=flashColor;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;flash*=.9;}
 ctx.restore();
}

/* One burst of confetti for the summit reveal — spawned once right as
   the reveal begins (see handleRoundEnd), then just falls and fades
   here every frame until it's off the bottom of the screen. */
function spawnConfetti(){
 confetti=[];
 if(reduceMotion)return;
 const colors=[M.accent,'#fbbf24','#fff','#f87171','#60a5fa'];
 for(let i=0;i<140;i++){
  confetti.push({
   x:Math.random()*W, y:-20-Math.random()*H*0.5,
   vx:(Math.random()-0.5)*1.6, vy:1.6+Math.random()*2.2,
   size:3+Math.random()*4, rot:Math.random()*7, vr:(Math.random()-0.5)*0.3,
   color:colors[Math.floor(Math.random()*colors.length)],
   shape:Math.random()<0.5?'rect':'circle'
  });
 }
}

/* Reaching the true ceiling is the one moment the mountain shows its
   whole shape — full silhouette, base to apex, rather than the
   windowed cliff-face view used while actually climbing. This reuses
   the same two-sided triangle technique the home-card thumbnails
   already draw safely; it's deliberately NOT built on the panning
   single-boundary face model (see buildFace's comment) since that's
   what caused the earlier topology bugs — this view is a static
   freeze-frame, never panned or re-anchored, so none of that risk
   applies here. Shown for the round-end pause whenever a round's own
   crash point reaches the true ceiling, which is exactly the event
   that also closes out the jackpot (see handleRoundEnd, and the
   server's own settlement logic in backend/src/game/room.js). */
function drawSummitReveal(ts){
 const a=M.accent;
 ctx.save();
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,M.skyHi);g.addColorStop(1,M.skyLo);
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 const sf=xmur3(M.id+'summitst');
 for(let i=0;i<90;i++){
  const x=(sf()%10000)/10000*W,y=(sf()%10000)/10000*H*.6,r=(sf()%10)/10*1.4+.3;
  ctx.globalAlpha=(sf()%100)/150+.25;ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
 }
 ctx.globalAlpha=1;

 const apexX=W*0.5, apexY=H*0.16, baseY=H*0.95;
 const baseL=-W*0.1, baseR=W*1.1;
 const sdL=xmur3(M.id+'revL'), sdR=xmur3(M.id+'revR');
 const N=60, run=[0]; let acc=0;
 for(let i=1;i<=N;i++){acc+=lerp(0.003,0.030,profileT(M,i/N));run.push(acc);}
 const total=run[N];
 ctx.beginPath();ctx.moveTo(baseL,baseY);
 for(let i=0;i<=N;i++){
  const tt=i/N, frac=run[i]/total;
  const x=baseL+frac*(apexX-baseL), y=baseY-tt*(baseY-apexY);
  const jag=((sdL()%1000)/1000-.5)*.015*W*(1-tt*.6);
  ctx.lineTo(x+jag,y);
 }
 for(let i=N-1;i>=0;i--){
  const tt=i/N, frac=run[i]/total;
  const x=baseR-frac*(baseR-apexX), y=baseY-tt*(baseY-apexY);
  const jag=((sdR()%1000)/1000-.5)*.015*W*(1-tt*.6);
  ctx.lineTo(x+jag,y);
 }
 ctx.lineTo(baseR,baseY);ctx.closePath();
 ctx.fillStyle=M.rock;ctx.fill();
 ctx.strokeStyle=a;ctx.globalAlpha=.75;ctx.lineWidth=3;ctx.stroke();ctx.globalAlpha=1;

 ctx.strokeStyle='#e8eef7';ctx.globalAlpha=.9;ctx.lineWidth=2.2;
 ctx.beginPath();ctx.moveTo(apexX,apexY);ctx.lineTo(apexX,apexY-34);ctx.stroke();
 ctx.fillStyle=a;ctx.beginPath();
 ctx.moveTo(apexX,apexY-34);ctx.lineTo(apexX+24,apexY-27);ctx.lineTo(apexX,apexY-20);ctx.closePath();ctx.fill();
 ctx.globalAlpha=1;

 /* the screen-wide gold flash (set in handleRoundEnd) already covers the
    "burst of light" moment — a ring drawn around the climber on top of
    that read as a floating halo/portal rather than a celebration, so the
    impact is left to the flash + confetti + shake + sound instead. */

 drawClimber(apexX-15,apexY+4,M.elev,ts,1);

 for(let i=confetti.length-1;i>=0;i--){
  const p=confetti[i];
  p.x+=p.vx;p.y+=p.vy;p.vy+=0.045;p.rot+=p.vr;
  if(p.y>H+20){confetti.splice(i,1);continue;}
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
  ctx.fillStyle=p.color;ctx.globalAlpha=.92;
  if(p.shape==='rect')ctx.fillRect(-p.size/2,-p.size*0.35,p.size,p.size*0.7);
  else{ctx.beginPath();ctx.arc(0,0,p.size*0.45,0,7);ctx.fill();}
  ctx.restore();
 }
 ctx.globalAlpha=1;

 ctx.restore();
}

/* ═══ CLIMBER — side-on, four-beat gait ═══ */
function limbPos(u,reach){
 if(u<0.28){const e=ease(u/0.28);return lerp(reach*0.42,-reach*0.42,e);}
 return lerp(-reach*0.42,reach*0.42,(u-0.28)/0.72);
}
function drawClimber(ex,ey,alt,ts,t){
 const climbing=phase==='climbing', fallen=phase==='fallen';
 const shallow=profileT(M,t);
 const rate=climbing?lerp(0.85,0.34,t)*lerp(0.55,1.3,shallow)*1.9:0.09;
 gait=(gait+rate*0.016)%1;
 const lean=clamp(0.06+slopeAngle(alt)*0.3,0,0.34);
 /* "fallen" covers BOTH a real crash and a summit — only a real crash
    should look dead (red, tumbling); reaching the top should still look
    triumphant, not like he just died at the exact moment he made it. */
 const falling=fallen&&!roundSummit;
 const fallEl=falling?Math.max(0,(ts-fallTS)/1000):0;
 /* A real fall used to just tumble off-screen forever (dropX/dropY grew
    unbounded with fallEl²), with nothing on screen tying that motion back
    to where the NEXT round actually starts — the community climb persists
    at exactly the fall altitude (see visualAltOf in room.js), so the
    climber picking back up from open space read as disconnected from
    that. Capping the freefall at ROPE_CATCH and settling into a taut,
    gently swinging hang instead gives the fall a visible anchor point:
    this is where he's caught, and where next round resumes. */
 const ROPE_CATCH=0.55, ROPE_SETTLE=0.5;
 const fallClamped=falling?Math.min(fallEl,ROPE_CATCH):0;
 const dropX=fallClamped*95, dropY=170*fallClamped*fallClamped;
 const caught=falling&&fallEl>ROPE_CATCH;
 const hangT=caught?clamp((fallEl-ROPE_CATCH)/ROPE_SETTLE,0,1):0;
 // once settled into the hang, the panic-red fades to a calm, neutral tone
 const danger=falling&&hangT<1;
 const col=falling?(danger?'#ef4444':'#cbd5e1'):'#fff';
 const rope=M.accent;

 if(falling){
  /* the rope itself, drawn in world space back to the exact point he fell
     from — slack while still in freefall, straight and taut once caught. */
  const ax=ex+15, ay=ey-2, cx=ex+15+dropX, cy=ey-2+dropY;
  ctx.save();
  ctx.strokeStyle=rope;ctx.globalAlpha=.6;ctx.lineWidth=1.3;
  ctx.beginPath();ctx.moveTo(ax,ay);
  ctx.quadraticCurveTo((ax+cx)/2+(1-hangT)*16,(ay+cy)/2,cx,cy);
  ctx.stroke();ctx.globalAlpha=1;
  ctx.restore();
 }

 ctx.save();
 ctx.translate(ex+15+dropX,ey-2+dropY);
 ctx.scale(1.2,1.2);
 /* fallen-but-not-falling is exclusively the summit pose (falling is
    fallen&&!roundSummit, so the only way to be fallen without falling is
    roundSummit) — that used to reuse a "settling on the ground" tilt of
    over a full radian, which is why it looked like he'd collapsed even
    once the colour was fixed. A standing climber gets a small idle sway
    instead, same as the resting sway used mid-climb, just upright. Once
    the rope catches a real fall, the tumble rotation eases into a gentle,
    decaying pendulum swing around a settled hanging tilt instead of
    spinning forever. */
 const tumbleRot=1.1+fallClamped*5.2+Math.sin(ts*0.02)*0.25;
 const hangSwing=Math.sin((fallEl-ROPE_CATCH)*2.6)*0.3*Math.exp(-(fallEl-ROPE_CATCH)*1.1);
 const hangRot=0.55+hangSwing;
 ctx.rotate(falling?lerp(tumbleRot,hangRot,hangT):fallen?Math.sin(ts*0.0018)*0.09:lean);
 ctx.lineCap='round';ctx.lineJoin='round';

 /* this soft aura is meant to ground the climber against the rock during
    normal close-up climbing — at the summit reveal's zoomed-out full-
    mountain scale that same fixed 19px circle dwarfs the tiny climber
    sprite and reads as a dark blob/portal around him instead, which is
    exactly the "looks weird" complaint. Only draw it up close. */
 if(!(fallen&&!falling)){
  ctx.globalAlpha=.15;ctx.fillStyle=danger?'#ef4444':rope;
  ctx.beginPath();ctx.arc(0,-8,19,0,7);ctx.fill();ctx.globalAlpha=1;
 }

 if(!fallen){
  ctx.strokeStyle=rope;ctx.globalAlpha=.42;ctx.lineWidth=1.1;
  ctx.beginPath();ctx.moveTo(-2,2);ctx.quadraticCurveTo(-14,20,-8,42);ctx.stroke();ctx.globalAlpha=1;
 }

 const R=15;
 const yRH=limbPos(gait,R), yLF=limbPos((gait+.25)%1,R),
       yLH=limbPos((gait+.5)%1,R), yRF=limbPos((gait+.75)%1,R);
 const mv=u=>u<0.28;
 const swRH=mv(gait), swLF=mv((gait+.25)%1), swLH=mv((gait+.5)%1), swRF=mv((gait+.75)%1);

 ctx.strokeStyle=col;ctx.lineWidth=2.7;
 ctx.globalAlpha=.62;
 ctx.beginPath();ctx.moveTo(0,3);
 ctx.lineTo(-7+(swRF?3:0),3+yRF*.5+7);ctx.lineTo(-13.5,3+yRF+10);ctx.stroke();
 ctx.globalAlpha=1;
 ctx.beginPath();ctx.moveTo(0,3);
 ctx.lineTo(-6+(swLF?4:0),3+yLF*.5+7);ctx.lineTo(-12.5,3+yLF+10);ctx.stroke();

 if(!fallen){
  ctx.fillStyle=M.snowC;ctx.globalAlpha=.5;
  ctx.fillRect(-16,3+yLF+9,3.5,1.6);
  ctx.fillRect(-17,3+yRF+9,3.5,1.6);
  ctx.globalAlpha=1;
 }

 ctx.lineWidth=3.6;
 ctx.beginPath();ctx.moveTo(0,3);ctx.lineTo(-2,-9);ctx.stroke();

 ctx.fillStyle=danger?'rgba(239,68,68,.85)':rope;
 ctx.globalAlpha=.88;
 ctx.save();ctx.translate(3.2,-5);ctx.rotate(.12);
 ctx.beginPath();ctx.roundRect(0,-4,5,10,1.6);ctx.fill();ctx.restore();
 ctx.globalAlpha=1;

 ctx.strokeStyle=col;ctx.lineWidth=2.5;
 ctx.globalAlpha=.62;
 ctx.beginPath();ctx.moveTo(-2,-7);
 ctx.lineTo(-9+(swRH?4:0),-7+yRH*.55-3);ctx.lineTo(-11,-7+yRH-6);ctx.stroke();
 ctx.globalAlpha=1;
 ctx.beginPath();ctx.moveTo(-2,-7);
 ctx.lineTo(-8+(swLH?5:0),-7+yLH*.55-3);ctx.lineTo(-10,-7+yLH-6);ctx.stroke();

 ctx.strokeStyle=danger?'#ef4444':'#9aa8bd';ctx.lineWidth=1.9;
 ctx.beginPath();ctx.moveTo(-11,-7+yRH-6);ctx.lineTo(-14,-7+yRH-9.5);ctx.stroke();
 ctx.beginPath();ctx.moveTo(-10,-7+yLH-6);ctx.lineTo(-13,-7+yLH-9.5);ctx.stroke();

 ctx.fillStyle=col;
 ctx.beginPath();ctx.arc(-2.5,-13.5,4.1,0,7);ctx.fill();
 ctx.fillStyle=danger?'#7f1d1d':'#0d1626';
 ctx.save();ctx.translate(-2.5,-14);ctx.rotate(.1);ctx.fillRect(-3.4,-1.3,6.8,2.5);ctx.restore();
 ctx.restore();

 if(climbing&&(swRH||swLH)&&Math.random()<.22)
  puffs.push({x:ex-4,y:ey-16+Math.random()*8,r:1,o:.55,vx:-.6-Math.random(),vy:.5+Math.random(),ice:true});
 if(climbing&&t>.3&&Math.random()<.05)
  puffs.push({x:ex+11,y:ey-14,r:1.6,o:.42,vx:1,vy:-.25,ice:false});
 for(let i=puffs.length-1;i>=0;i--){
  const p=puffs[i];
  p.x+=p.vx;p.y+=p.vy;p.r+=p.ice?.1:.55;p.o-=p.ice?.03:.014;
  if(p.o<=0){puffs.splice(i,1);continue;}
  ctx.globalAlpha=p.o;ctx.fillStyle=p.ice?M.snowC:'#fff';
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
 }
 ctx.globalAlpha=1;
}

function updJackpotUI(){
 if(!M)return;
 /* M.progress (the long-term community climb) only ratchets forward once
    a round actually ends — but the climber sprite and the "CURRENT
    HEIGHT" HUD both already show this round's live position while it's
    still climbing, which made this box look frozen well below where the
    climber visibly was. A round can only ever end at or above its live
    position (mult only ever increases), so showing that live position
    here early is never overstating anything — it's exactly what this
    will become the moment the round settles. */
 const liveProgress=phase==='climbing'?clamp(altOf(mult)-M.base,0,M.elev-M.base):(M.progress||0);
 const frac=clamp(liveProgress/(M.elev-M.base),0,1);
 const push=frac>=SUMMIT_PUSH_FRAC&&frac<1;
 document.getElementById('jk-amt').textContent=f2(M.jackpot);
 document.getElementById('jackpot').classList.toggle('push',push);
 document.getElementById('jk-lab').textContent=push?'🚨 SUMMIT PUSH':'🎰 SUMMIT JACKPOT';
 document.getElementById('jk-sub').textContent=push
  ?'🚩 climber at '+Math.round(M.base+liveProgress).toLocaleString()+' m — final push, small chance of a late fall'
  :'🧗 climber at '+Math.round(M.base+liveProgress).toLocaleString()+' m of '+M.elev.toLocaleString()+' m';
}

function updBet(i){
 const b=bets[i],btn=document.getElementById('b'+i),st=document.getElementById('bs'+i);
 if(!btn)return;
 let cls='place',txt='PLACE STAKE',s='',sc='var(--dim)';
 if(b){
  if(b.state==='pending'){cls='queued';txt='PLACING…';s='PENDING';sc='#7dd3fc';}
  else if(b.state==='queued'){cls='queued';txt='✕ CANCEL · '+f2(b.stake)+' TKN';s='QUEUED';sc='#7dd3fc';}
  else if(b.state==='next'){cls='queued';txt='✕ CANCEL NEXT · '+f2(b.stake);s='NEXT ROUND';sc='#818cf8';}
  else if(b.state==='live'){cls='cash';txt='TURN BACK · '+fx(mult);s='CLIMBING';sc='var(--gn)';}
  else if(b.state==='cashed'){cls='done';txt='✓ +'+f2(b.payout)+' TKN';s='TURNED BACK @ '+fx(b.cashMult);sc='var(--gn)';}
  else if(b.state==='lost'){cls='dead';txt=b.refund>0?'FELL · '+f2(b.refund)+' BACK':'FELL AT '+fx(crashAt);s='FELL';sc='var(--rd)';}
 } else if(phase==='climbing'||phase==='fallen'){cls='next';txt='STAKE NEXT ROUND';}
 btn.className='act '+cls;btn.textContent=txt;
 st.textContent=s;st.style.color=sc;
}
function updBetLive(i){
 const b=bets[i];
 if(b&&b.state==='live'){const btn=document.getElementById('b'+i);if(btn)btn.textContent='TURN BACK · '+fx(mult);}
}
function qm(i,f){const e=document.getElementById('s'+i);e.value=Math.max(1,Math.round(+e.value*f));}
function qs(i,v){document.getElementById('s'+i).value=v;}

function tgl(i){const c=document.getElementById('c'+i);c.classList.toggle('on');c.textContent=c.classList.contains('on')?'✓':'';}
function tglAP(i){
 autoplay[i]=!autoplay[i];
 const c=document.getElementById('ap'+i);
 c.classList.toggle('on',autoplay[i]);c.textContent=autoplay[i]?'✓':'';
 if(autoplay[i]&&!bets[i]&&(phase==='waiting'||phase==='idle'))autoRebet(i);
}
/* Re-places whatever is currently configured in the stake/auto fields —
   letting the player set it once and have it repeat, rather than only
   being able to auto-cash-out within a single already-placed round. */
function autoRebet(i){
 const s=+document.getElementById('s'+i).value||0;
 const a=+document.getElementById('a'+i).value||null;
 if(s<=0||s>balance){
  autoplay[i]=false;
  const c=document.getElementById('ap'+i);if(c){c.classList.remove('on');c.textContent='';}
  toast('Autoplay stopped — insufficient balance','l');
  return;
 }
 placeStake(i,s,a);
}

function betAction(i){
 const b=bets[i];
 if(b&&b.state==='live'){cashOut(i);return;}
 if(b&&(b.state==='queued'||b.state==='next')){cancelStake(i);return;}
 if(b&&(b.state==='pending'||b.state==='cashed'||b.state==='lost'))return;
 if(!myUser){toast('Still connecting — try again in a moment','i');return;}
 const s=+document.getElementById('s'+i).value||0;
 const a=+document.getElementById('a'+i).value||null;
 if(s<=0){toast('Enter a stake amount','i');return;}
 if(s>balance){toast('Insufficient balance','l');return;}
 ensureAudio();sfxBet();
 placeStake(i,s,a);
 if(phase!=='waiting')toast('Staked for the next ascent','i');
}
/* Sends the stake to the server and shows it as pending immediately for
   responsiveness — but never touches `balance` locally. The server is the
   only place that ever mutates an account's balance; the client waits for
   the 'balance' message it sends back once the debit actually happens. */
function placeStake(i,stake,autoCashout){
 const autoOn=document.getElementById('c'+i).classList.contains('on');
 bets[i]={stake,auto:(autoCashout&&autoCashout>1.01)?autoCashout:null,autoOn:autoOn&&!!autoCashout,
  state:'pending',cashMult:null,payout:0,refund:0};
 updBet(i);
 wsSend({type:'bet',mountainId:M.id,slot:i,stake,autoCashout:(autoCashout&&autoCashout>1.01)?autoCashout:null});
}
function cancelStake(i){
 wsSend({type:'cancelBet',mountainId:M.id,slot:i});
}
function cashOut(i){
 const b=bets[i];
 if(!b||b.state!=='live'||phase!=='climbing')return;
 wsSend({type:'cashOut',mountainId:M.id,slot:i});
}

 try{
  const res=await fetch('/api/topup',{method:'POST',credentials:'same-origin'});
  const data=await res.json();
  if(!res.ok){toast(data.message||'Faucet unavailable','l');return;}
  balance=data.balance;updBal();
  toast('+1,000.00 TKN added (demo faucet)','i');
 }catch(e){toast('Faucet unavailable','l');}
}

 maths:{t:'The numbers',s:'HOW THE PEAKS ARE BUILT',b:()=>`
  <p>Every mountain is generated from its real-world data rather than tuned by hand.</p>
  <h3>Summit at = real height ÷ 100</h3>
  <p>Everest is 8,849 m, so reaching it guarantees a summit at 88×. Mont Blanc is 4,808 m, so its own guaranteed-summit point is 48×. Nothing else sets that figure — and it's a floor for the biggest possible result on a peak, not a ceiling: a round can climb well past it, no maximum win in place.</p>
  <h3>Fall rate = real fatality rate</h3>
  <p>The chance a round ends instantly at 1.00× comes from how deadly the mountain actually is. Kilimanjaro sits at 2%. K2 sits at 22%.</p>
  <p>K2 is only 238 m shorter than Everest, so they guarantee a summit at almost the same multiplier — but K2 ends early roughly six times as often. Same peak, completely different game.</p>
  <h3>RTP</h3>
  <p><strong>Return to player</strong> is the share of all money staked that comes back to players across the long run. 97% RTP means £97 returned per £100 staked, averaged over a very large number of rounds. It says nothing about any single round, and it is not a prediction of what you will get.</p>
  <h3>Money back</h3>
  <p>Peaks with the lowest base return give the most back on a losing stake — see <strong>Rewards</strong> in this menu for exactly how that works.</p>`},

 rewards:{t:'Rewards',s:'WHAT COMES BACK ON A FALL',b:()=>`
  <p>Every mountain refunds a slice of your stake when a round falls — never on a win. Two separate mechanics feed that refund.</p>
  <h3>Rakeback</h3>
  <p>A fixed slice of your stake back on <strong>any</strong> fall, no conditions. Not every peak offers it — check a mountain's card, or <strong>The six peaks</strong> in this menu, for its rate. Mont Blanc offers none; K2 offers the most, at 8%.</p>
  <h3>Lossback</h3>
  <p>A second, separate refund on top of rakeback — but only when the round falls early, below that peak's own cutoff multiplier. Some peaks pay it on <em>any</em> fall regardless of where it stopped; most don't offer it at all. Again, check the peak's own card for its exact rate and cutoff.</p>
  <h3>Why this exists</h3>
  <p>A peak with a lower base <strong>return to player</strong> makes up the difference here instead — the money isn't gone, it's just handed back through rakeback and lossback rather than baked into every round's odds. That's why <strong>effective</strong> return varies by how a session actually plays out, while base RTP is the same for every player on that peak regardless of luck.</p>
  <div class="note"><p>Every refund lands straight in your account <strong>balance</strong> the moment it's paid — that's the only figure that's actually persisted.</p></div>`},

 fair:{t:'Provably fair',s:'VERIFYING THE RESULT',b:()=>`
  <p>The result of every round is decided before the climb starts, and can be checked afterwards.</p>
  <p>Before the round, the server publishes a real SHA-256 commitment of a fresh secret seed it just generated with a cryptographically secure random source — that's the "PROVABLY FAIR" line in the sidebar. SHA-256 only runs one way, so the seed cannot be worked out from the commitment alone, and because every player watching a mountain sees the exact same commitment for the exact same round, nobody — including the house — can quietly change the outcome after stakes are in.</p>
  <p>Once a round ends, that round's seed is revealed directly underneath, in the box marked <strong>PREVIOUS ROUND</strong>. Your browser independently re-hashes the revealed seed and checks it against the commitment you were shown beforehand, and separately replays the seed through the same crash-point formula to confirm it produces the exact multiplier the round actually crashed at. Both checks run locally in your browser, not just claimed — that's the loop that makes "provably fair" provable rather than asserted.</p>
  <div class="note"><p>This is a demonstration build with no real-money wagering — see Legal for details. The fairness mechanism itself, however, is real: genuine server-side CSPRNG seed generation and a real SHA-256 commitment, not a stand-in.</p></div>`},
